name: Docker Publish

on:
  # Called by release-please.yml as part of the release run. Failures surface
  # in that run instead of getting lost in a separate, fire-and-forget one.
  workflow_call:
    inputs:
      version:
        description: 'Release tag to build (e.g., v2.5.6)'
        required: true
        type: string
      sha:
        description: 'Commit SHA to build from'
        required: true
        type: string
  # Rebuild an existing tag without cutting a new release — base image CVE,
  # transient GHCR failure, retry of a broken build.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.31.6)'
        required: true
  # Manually pushed tags. Release-please tags do NOT reach this trigger:
  # pushes made with GITHUB_TOKEN never start a workflow run.
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ostsee-tiere

permissions: {}

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-latest
    permissions: {}

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      # github.event_name ist bei workflow_call das Event des AUFRUFERS (also
      # `push`, wenn release-please durch einen main-Push lief) — es taugt hier
      # nicht zur Unterscheidung. inputs.version ist nur bei workflow_call
      # gesetzt und ist deshalb das verlässliche Signal.
      - name: Determine version
        id: version
        env:
          CALL_VERSION: ${{ inputs.version }}
          CALL_SHA: ${{ inputs.sha }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${CALL_VERSION}" ]; then
            VERSION="${CALL_VERSION}"
            SHA="${CALL_SHA}"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${DISPATCH_TAG}"
            SHA="${GIT_SHA}"
          else
            VERSION="${REF_NAME}"
            SHA="${GIT_SHA}"
          fi

          if [ -z "${VERSION}" ] || [ -z "${SHA}" ]; then
            echo "::error::Version oder SHA konnte nicht bestimmt werden (version='${VERSION}' sha='${SHA}')."
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Log build info
        run: |
          echo "Building Docker image for version: ${{ steps.version.outputs.version }}"
          echo "Using commit SHA: ${{ steps.version.outputs.sha }}"

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ needs.prepare.outputs.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "Digest: $digest"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create Multi-Platform Manifest
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.inspect.outputs.digest }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Beim Build entstehen NUR die unveränderlichen Versions-Tags plus der
      # bewegliche `staging`-Zeiger. Die Production-Zeiger (`production`,
      # `latest`, MAJOR, MINOR) setzt ausschließlich promote-production.yml —
      # sonst stünde das frisch gebaute Image sofort auf dem Prod-Host und das
      # Staging würde nichts absichern. Siehe docs/RELEASE_PIPELINE.md.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          # Remove 'v' prefix for semver tags
          SEMVER="${VERSION#v}"

          echo "Creating manifest for version: $VERSION"
          echo "Tags: $VERSION, $SEMVER, staging"

          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${VERSION} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${SEMVER} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:staging \
            $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        id: inspect
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${VERSION}
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${VERSION} --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Image digest: $DIGEST"

      - name: Generate image digest file
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "Image Digest: ${{ steps.inspect.outputs.digest }}" > image-digest.txt
          echo "Version: ${VERSION}" >> image-digest.txt
          echo "Platforms: linux/amd64, linux/arm64" >> image-digest.txt
          echo "" >> image-digest.txt
          echo "Pull Command:" >> image-digest.txt
          echo "docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${VERSION}" >> image-digest.txt

      - name: Upload image digest as artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-digest
          path: image-digest.txt
          retention-days: 90

  create-release-assets:
    name: Create Release Assets
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    if: startsWith(needs.prepare.outputs.version, 'v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download image digest
        uses: actions/download-artifact@v8
        with:
          name: docker-image-digest

      - name: Create deployment package
        run: |
          mkdir -p release-assets

          # Copy Docker Compose files
          cp docker-compose.production.yml release-assets/

          # Copy environment template
          cp .env.example release-assets/.env.example

          # Copy monitoring configuration
          cp -r monitoring release-assets/ 2>/dev/null || true

          # Copy deployment documentation
          cp docs/DOCKER_DEPLOYMENT.md release-assets/ 2>/dev/null || true
          cp docs/ENVIRONMENT.md release-assets/ 2>/dev/null || true

          # Copy image digest
          cp image-digest.txt release-assets/

          # Create README for the package
          cat > release-assets/README.md << 'EOF'
          # Ostsee-Tiere Docker Deployment Package

          This package contains everything you need to deploy Ostsee-Tiere using Docker.

          ## Quick Start

          1. Configure your environment:
             ```bash
             cp .env.example .env
             nano .env  # Edit with your settings
             ```

          2. Start the services:
             ```bash
             docker compose -f docker-compose.production.yml up -d
             ```

          3. Access the application at http://localhost:3000

          ## Documentation

          - See `DOCKER_DEPLOYMENT.md` for detailed deployment instructions
          - See `ENVIRONMENT.md` for environment variable reference
          - See `image-digest.txt` for Docker image information

          ## Support

          For issues and questions, visit:
          https://github.com/jansinger/ostsee-tiere/issues
          EOF

          # Create tarball
          VERSION="${{ needs.prepare.outputs.version }}"
          tar -czf ostsee-tiere-docker-${VERSION}.tar.gz -C release-assets .

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: |
            ostsee-tiere-docker-${{ needs.prepare.outputs.version }}.tar.gz
            release-assets/docker-compose.production.yml
            release-assets/.env.example
            release-assets/image-digest.txt
          fail_on_unmatched_files: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.8
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.json
          retention-days: 90
