name: Docker Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and push'
        required: true
        default: 'latest'
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ostsee-sichtung

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ============================================
  # Build and Push Docker Image
  # ============================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Only run if workflow_run was successful or for other trigger types
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Generate image digest file
        run: |
          echo "Image Digest: ${{ steps.build-and-push.outputs.digest }}" > image-digest.txt
          echo "Image Tags:" >> image-digest.txt
          echo "${{ steps.meta.outputs.tags }}" >> image-digest.txt
          echo "" >> image-digest.txt
          echo "Pull Command:" >> image-digest.txt
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}" >> image-digest.txt

      - name: Upload image digest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-digest
          path: image-digest.txt
          retention-days: 90

  # ============================================
  # Create Release Assets
  # ============================================
  create-release-assets:
    name: Create Release Assets
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download image digest
        uses: actions/download-artifact@v4
        with:
          name: docker-image-digest

      - name: Create deployment package
        run: |
          mkdir -p release-assets

          # Copy Docker Compose files
          cp docker-compose.production.yml release-assets/

          # Copy environment template
          cp .env.example release-assets/.env.example

          # Copy monitoring configuration
          cp -r monitoring release-assets/

          # Copy deployment documentation
          cp docs/DOCKER_DEPLOYMENT.md release-assets/ || true
          cp docs/ENVIRONMENT.md release-assets/ || true

          # Copy image digest
          cp image-digest.txt release-assets/

          # Create README for the package
          cat > release-assets/README.md << 'EOF'
          # Ostsee-Tiere Docker Deployment Package

          This package contains everything you need to deploy Ostsee-Tiere using Docker.

          ## Quick Start

          1. Configure your environment:
             ```bash
             cp .env.example .env
             nano .env  # Edit with your settings
             ```

          2. Start the services:
             ```bash
             docker compose -f docker-compose.production.yml up -d
             ```

          3. Access the application at http://localhost:3000

          ## Documentation

          - See `DOCKER_DEPLOYMENT.md` for detailed deployment instructions
          - See `ENVIRONMENT.md` for environment variable reference
          - See `image-digest.txt` for Docker image information

          ## Support

          For issues and questions, visit:
          https://github.com/${{ github.repository }}/issues
          EOF

          # Create tarball
          tar -czf ostsee-tiere-docker-${{ github.ref_name }}.tar.gz -C release-assets .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ostsee-tiere-docker-${{ github.ref_name }}.tar.gz
            release-assets/docker-compose.production.yml
            release-assets/.env.example
            release-assets/image-digest.txt
          fail_on_unmatched_files: false

  # ============================================
  # Security Scan
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Determine image tag for scanning
        id: determine-tag
        run: |
          # Determine which tag to scan based on event type
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            # For tag pushes, use the tag name without 'refs/tags/'
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            # For releases, use the tag name
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # For workflow_run (after semantic-release), use 'latest' or 'main'
            TAG="latest"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # For manual dispatch, use provided input or default
            TAG="${{ inputs.tag }}"
          else
            # Fallback to branch name
            TAG="${{ github.ref_name }}"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Scanning image with tag: ${TAG}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.determine-tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.determine-tag.outputs.tag }}
          format: 'json'
          output: 'trivy-results.json'

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.json
          retention-days: 90

  # ============================================
  # Notification
  # ============================================
  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: [build-and-push, create-release-assets, security-scan]
    if: always()

    steps:
      - name: Report workflow status
        run: |
          if [ "${{ needs.build-and-push.result }}" == "success" ]; then
            echo "✅ Docker image built and pushed successfully"
          else
            echo "❌ Docker image build failed"
            exit 1
          fi

          if [ "${{ needs.create-release-assets.result }}" == "success" ]; then
            echo "✅ Release assets created successfully"
          fi

          if [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "✅ Security scan completed"
          fi
