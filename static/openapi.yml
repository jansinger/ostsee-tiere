  /api/media/{path}:
    get:
      tags:
        - media
      summary: Sichere Medien-Bereitstellung
      description: |
        Stellt Mediendateien mit Zugriffskontrolle bereit.

        **Zugriffskontrolle:**
        - Öffentlicher Zugriff für genehmigte Sichtungen
        - Admin-Zugriff für nicht genehmigte Sichtungen
        - 404 für nicht existierende oder nicht autorisierte Dateien

        **Caching:** Genehmigte Dateien sind CUID-benannt und unveränderlich
        und bekommen `Cache-Control: public, max-age=31536000, immutable`.
        Nicht genehmigte Dateien (nur per Admin-Zugriff erreichbar) bekommen
        stattdessen `private, no-store` — geteilte Caches (CDN, Proxy) dürfen
        sie nicht vorhalten, und eine spätere Ablehnung der Sichtung
        invalidiert dadurch nichts Zwischengespeichertes.

        **Range-Unterstützung:**
        Die Route kündigt `Accept-Ranges: bytes` an und beantwortet einen
        `Range`-Header mit `206 Partial Content`, sofern der Storage den
        angeforderten Bereich tatsächlich liefert — sonst mit `200` und der
        vollen Datei. Ein unerfüllbarer Bereich ergibt `416 Range Not
        Satisfiable`. Nötig für Video-Seeking und Safari/iOS-Wiedergabe.

        **Volumen-Bremse:**
        Zusätzlich zum Anfragenzahl-Rate-Limit gilt ein stündliches
        Byte-Budget je IP bzw. Nutzer (1 GB anonym, 5 GB authentifiziert). Es
        bucht die tatsächlich ausgelieferte Menge — bei einer Teilanfrage die
        Bereichslänge — und verhindert, dass ein `Range`-Header über die ganze
        Datei das enge Anfragenzahl-Limit umgeht.
      parameters:
        - name: path
          in: path
          required: true
          description: Dateipfad der Mediendatei
          schema:
            type: string
            example: "sichtung-123/photo-abc123.jpg"
        - name: Range
          in: header
          required: false
          description: |
            Byte-Bereich nach RFC 9110 (`bytes=start-end`), z. B. für
            Video-Seeking. Mehrfach-Bereiche werden wie „kein Range" behandelt.
          schema:
            type: string
            example: "bytes=0-1023"
      responses:
        '200':
          description: Mediendatei erfolgreich bereitgestellt (vollständig)
          headers:
            Content-Type:
              description: MIME-Type der Datei
              schema:
                type: string
                example: "image/jpeg"
            Content-Length:
              description: Dateigröße in Bytes
              schema:
                type: integer
                example: 1024000
            Content-Disposition:
              description: Wie die Datei angezeigt werden soll
              schema:
                type: string
                example: 'inline; filename="photo.jpg"'
            Cache-Control:
              description: |
                Cache-Einstellungen. `public, max-age=31536000, immutable` für
                genehmigte Dateien, `private, no-store` für nicht genehmigte
                (nur per Admin-Zugriff erreichbar).
              schema:
                type: string
                enum:
                  - "public, max-age=31536000, immutable"
                  - "private, no-store"
            ETag:
              description: Entity Tag für Caching
              schema:
                type: string
                example: '"abc123def456"'
            Accept-Ranges:
              description: Kündigt Range-Unterstützung an
              schema:
                type: string
                example: "bytes"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: |
            Angeforderter Byte-Bereich (Partial Content). Wird nur gesendet,
            wenn der Storage den Bereich tatsächlich liefert — antwortet der
            Storage stattdessen mit der vollen Datei (z. B. ein CDN, das den
            Range-Header ignoriert), sendet die Route `200` mit der vollen
            Länge statt einer widersprüchlichen `206`-Antwort.
          headers:
            Content-Range:
              description: Gelieferter Bereich und Gesamtgröße
              schema:
                type: string
                example: "bytes 0-1023/1024000"
            Content-Length:
              description: Länge des gelieferten Bereichs in Bytes
              schema:
                type: integer
                example: 1024
            Accept-Ranges:
              description: Kündigt Range-Unterstützung an
              schema:
                type: string
                example: "bytes"
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Not Modified (Cache-Hit)
        '404':
          description: Datei nicht gefunden oder nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "File not found"
        '416':
          description: Angeforderter Byte-Bereich ist nicht erfüllbar
          headers:
            Content-Range:
              description: Gesamtgröße der Datei zur Orientierung
              schema:
                type: string
                example: "bytes */1024000"
        '429':
          description: |
            Stündliches Byte-Budget für die Auslieferung ausgeschöpft (1 GB/h
            anonym, 5 GB/h authentifiziert je IP bzw. Nutzer). Gezählt wird die
            tatsächlich ausgelieferte Menge — bei einer Teilanfrage die
            Bereichslänge, nicht die Dateigröße. Ein `Range`-Header über die
            ganze Datei (z. B. `bytes=0-`) bucht deshalb genauso viel wie eine
            Anfrage ohne `Range`-Header; das reine Anfragenzahl-Limit oben
            deckelt dieses Volumen nicht.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Sie haben in der letzten Stunde bereits sehr viele Daten von diesem Server geladen. Bitte versuchen Sie es später erneut."
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    get:
      tags:
        - auth
      summary: Login initieren
      description: Startet den Auth0-Login-Flow
      parameters:
        - name: returnUrl
          in: query
          description: URL nach erfolgreichem Login
          schema:
            type: string
            format: uri
            example: "/admin"
        - name: authRetry
          in: query
          description: >-
            Interner Marker. Wird vom Callback gesetzt, wenn er den Login wegen
            abgelaufener Flow-Cookies neu gestartet hat, und in die redirect_uri
            übernommen, damit der Callback ihn nach dem Auth0-Rücklauf wiedersieht.
            Nur der Wert '1' wird weitergereicht.
          schema:
            type: string
            enum:
              - '1'
      responses:
        '302':
          description: Weiterleitung zu Auth0
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/logout:
    get:
      tags:
        - auth
      summary: Logout
      description: >
        Beendet die Session serverseitig und leitet zu Auth0 Logout weiter.

        Der Aufruf widerruft die Session-Zeile in der Datenbank: Das Cookie ist danach
        auch dann ungültig, wenn der Client es behält. Bis zum Session-Store löschte
        dieser Endpunkt nur das Cookie, das signierte JWT blieb gültig.
      responses:
        '302':
          description: Weiterleitung zu Auth0 Logout

  /api/auth/callback:
    get:
      tags:
        - auth
      summary: Auth0 Callback
      description: Verarbeitet die Antwort von Auth0 nach erfolgreichem Login
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization Code von Auth0
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: CSRF-Protection State
          schema:
            type: string
        - name: returnUrl
          in: query
          description: Ursprüngliche Ziel-URL
          schema:
            type: string
            format: uri
        - name: authRetry
          in: query
          description: >-
            Interner Marker. Wird gesetzt, wenn der Login wegen abgelaufener
            Flow-Cookies bereits einmal neu gestartet wurde, und verhindert eine
            Endlosschleife zwischen Login und Callback.
          schema:
            type: string
            enum:
              - '1'
      responses:
        '302':
          description: >-
            Weiterleitung nach erfolgreichem Login zur returnUrl — oder zurück auf
            /api/auth/login, wenn die Flow-Cookies abgelaufen oder bereits verbraucht
            sind (dann mit authRetry=1).
        '403':
          description: >-
            Fehlender Code, oder vorhandener State-Cookie, der dem übergebenen state
            widerspricht (CSRF-Verdacht). Ebenso, wenn der Login-Neustart bereits
            erfolglos versucht wurde (authRetry=1).
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/files/upload:
    post:
      tags:
        - files
      summary: Datei hochladen
      description: |
        Lädt eine Bild- oder Videodatei hoch.

        Unterstützte Formate (sechs, aus `security.allowedFileTypes`):
        - Bilder: JPEG, PNG, GIF, WebP (kein SVG — aus Sicherheitsgründen
          ausdrücklich ausgeschlossen)
        - Videos: MP4, QuickTime (MOV)

        Maximale Dateigröße: konfigurationsabhängig und nach Medientyp getrennt
        (Vorbelegung 10 MB für Bilder, 100 MB für Videos), im Admin-Bereich
        änderbar über `security.maxFileSize` bzw. `security.maxVideoFileSize`.
        Zusätzlich gilt ein Gesamtlimit je Meldung (`referenceId`, Vorbelegung
        250 MB, `security.maxTotalUploadSize`) — es zählt die Summe aller
        bereits für diese Meldung hochgeladenen Dateien zuzüglich der neuen.
        Die aktuellen Werte liefert `GET /api/config/upload`. Eine Überschreitung
        der Einzeldatei- oder der Gesamtgrenze ergibt `413`, ein nicht erlaubter
        Dateityp `400`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Die hochzuladende Datei
      responses:
        '200':
          description: Datei erfolgreich hochgeladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: >-
            Datei zu groß, oder die Meldung (`referenceId`) würde durch diese
            Datei ihr Gesamtlimit überschreiten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Nicht unterstützter Medientyp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/files/delete:
    delete:
      tags:
        - files
      summary: Datei löschen
      description: |
        Löscht eine hochgeladene Datei.

        Rate-Limiting je nach Authentifizierungsstatus (anonym / authentifiziert)
        verhindert massenhaftes anonymes Löschen.

        Ownership: Anonyme Nutzer können nur noch nicht zugeordnete Dateien
        (ohne Sichtungs-Zuordnung) löschen, die sie selbst hochgeladen haben
        (Nachweis über ein serverseitig gesetztes `upload-uid`-Cookie). Fehlt
        das Cookie oder gehört die Datei einem anderen Uploader, wird 403
        zurückgegeben. Admins dürfen jede Datei löschen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filePath
              properties:
                filePath:
                  type: string
                  description: Pfad der zu löschenden Datei
                  example: "uploads/2024/01/image_123.jpg"
      responses:
        '200':
          description: Datei erfolgreich gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/geo/inBaltic:
    get:
      tags:
        - geo
      summary: Ostsee-Koordinaten prüfen
      description: Überprüft, ob gegebene Koordinaten in der Ostsee liegen
      parameters:
        - name: latitude
          in: query
          required: true
          description: Breitengrad
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
            example: 54.3233
        - name: longitude
          in: query
          required: true
          description: Längengrad
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
            example: 13.0814
      responses:
        '200':
          description: Koordinatenvalidierung erfolgreich
          content:
            application/json:
              schema:
                type: object
                required:
                  - inBaltic
                  - inChartArea
                properties:
                  inBaltic:
                    type: boolean
                    description: true wenn Koordinaten in der Ostsee liegen
                    example: true
                  inChartArea:
                    type: boolean
                    description: true wenn Koordinaten im angezeigten Kartenbereich liegen
                    example: true
                  message:
                    type: string
                    description: Zusätzliche Information
                    example: "Koordinaten liegen in der Ostsee"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/map/sightings:
    get:
      tags:
        - map
      summary: Kartendaten für Sichtungen
      description: |
        Ruft Sichtungsdaten für die Kartendarstellung ab.
        Optimiert für große Datenmengen mit räumlicher Filterung.

        Liefert nur freigegebene Sichtungen (`freigegeben_am IS NOT NULL`) mit
        plausiblen Ostsee-Koordinaten (Bounding Box `9.4–30.2°O`, `53.0–66.0°N`).
        Sichtungen mit fehlenden oder unplausiblen Koordinaten werden serverseitig
        ausgeschlossen, damit keine "Null Island"-Marker ([0,0]) auf der Karte
        erscheinen.

        Mit `status` (nur Admin) lassen sich zusätzlich offene und abgelehnte
        Meldungen einbeziehen — die öffentliche Antwort bleibt unverändert.
      parameters:
        - name: status
          in: query
          description: |
            Bearbeitungszustände, kommasepariert (`open`, `approved`, `rejected`).
            **Nur mit angemeldeter Admin-Session.** Ohne diesen Parameter liefert
            der Endpunkt unverändert nur freigegebene Sichtungen; mit dem
            Parameter und ohne Admin-Rechte antwortet er mit 403.
          schema:
            type: string
            example: "open,rejected"
        - name: bbox
          in: query
          description: Bounding Box (minLon,minLat,maxLon,maxLat)
          schema:
            type: string
            pattern: '^-?\d+\.?\d*,-?\d+\.?\d*,-?\d+\.?\d*,-?\d+\.?\d*$'
            example: "10.0,53.0,15.0,56.0"
        - name: zoom
          in: query
          description: Zoomstufe der Karte
          schema:
            type: integer
            minimum: 1
            maximum: 20
            example: 8
        - name: year
          in: query
          description: Jahr der Sichtungen
          schema:
            type: integer
            minimum: 2000
            maximum: 2030
            example: 2024
        - name: species
          in: query
          description: Tierart filtern
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Kartendaten für Sichtungen
          content:
            application/json:
              schema:
                type: object
                required:
                  - features
                  - type
                properties:
                  type:
                    type: string
                    enum: [FeatureCollection]
                    example: "FeatureCollection"
                  features:
                    type: array
                    items:
                      $ref: '#/components/schemas/SightingGeoFeature'
        '400':
          description: Unbekannter oder leerer Statuswert
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Welcher Statuswert abgelehnt wurde
                    example: "Unbekannter Status: verified"
              example:
                error: "Unbekannter Status: verified"
        '403':
          description: Statusfilter ohne Admin-Anmeldung angefragt
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Generischer Hinweis ohne Angabe zur Sitzung
                    example: "Statusfilter erfordert eine Admin-Anmeldung"
              example:
                error: "Statusfilter erfordert eine Admin-Anmeldung"
        '500':
          description: >-
            Interner Serverfehler. Es wird ausschließlich eine generische
            Fehlermeldung zurückgegeben; interne Fehlerdetails (`details`,
            Exception-Message) werden aus Sicherheitsgründen NICHT an den Client
            geleakt (der konkrete Fehler wird nur serverseitig geloggt).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Generische Fehlermeldung ohne interne Details
                    example: "Fehler beim Abrufen der Sichtungen"
              example:
                error: "Fehler beim Abrufen der Sichtungen"

  /api/map/sightings/years:
    get:
      tags:
        - map
      summary: Verfügbare Jahre für die Sichtungskarte
      description: |
        Liefert die Jahre, für die freigegebene Sichtungen mit plausiblen
        Ostsee-Koordinaten vorliegen, jeweils mit Anzahl — absteigend nach Jahr
        sortiert. Jahre ohne Treffer (`count = 0`) werden nicht ausgegeben.

        Dieselbe Grundmenge wie `GET /api/map/sightings` (Freigabe- und
        Koordinatenfilter identisch), damit Jahres-Dropdown und Kartendaten nie
        auseinanderlaufen. Das Kalenderjahr wird in deutscher Ortszeit gebildet
        (Europe/Berlin), nicht UTC.

        Mit `status` (nur Admin) lassen sich zusätzlich offene und abgelehnte
        Meldungen einbeziehen — die öffentliche Antwort bleibt unverändert.
      parameters:
        - name: status
          in: query
          description: |
            Bearbeitungszustände, kommasepariert (`open`, `approved`, `rejected`).
            **Nur mit angemeldeter Admin-Session.** Ohne diesen Parameter liefert
            der Endpunkt unverändert nur freigegebene Sichtungen; mit dem
            Parameter und ohne Admin-Rechte antwortet er mit 403.
          schema:
            type: string
            example: "open,rejected"
      responses:
        '200':
          description: Verfügbare Jahre mit Anzahl der Sichtungen
          content:
            application/json:
              schema:
                type: object
                required:
                  - years
                properties:
                  years:
                    type: array
                    items:
                      type: object
                      required:
                        - year
                        - count
                      properties:
                        year:
                          type: integer
                          example: 2025
                        count:
                          type: integer
                          example: 817
              example:
                years:
                  - year: 2025
                    count: 817
                  - year: 2024
                    count: 632
        '400':
          description: Unbekannter oder leerer Statuswert
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Welcher Statuswert abgelehnt wurde
                    example: "Unbekannter Status: verified"
              example:
                error: "Unbekannter Status: verified"
        '403':
          description: Statusfilter ohne Admin-Anmeldung angefragt
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Generischer Hinweis ohne Angabe zur Sitzung
                    example: "Statusfilter erfordert eine Admin-Anmeldung"
              example:
                error: "Statusfilter erfordert eine Admin-Anmeldung"
        '500':
          description: >-
            Interner Serverfehler. Es wird ausschließlich eine generische
            Fehlermeldung zurückgegeben; interne Fehlerdetails (`details`,
            Exception-Message) werden aus Sicherheitsgründen NICHT an den Client
            geleakt (der konkrete Fehler wird nur serverseitig geloggt).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Generische Fehlermeldung ohne interne Details
                    example: "Fehler beim Abrufen der verfügbaren Jahre"
              example:
                error: "Fehler beim Abrufen der verfügbaren Jahre"

  /rest_sichtungen:
    get:
      tags:
        - legacy
      summary: '[LEGACY] Sichtungsdaten abrufen (Index)'
      description: |
        **Derselbe Endpunkt wie `GET /sichtungen/showreports.json`, unter dem
        zweiten Namen der Vorgänger-API.**

        Zusätzlich unter `/de/…` und `/en/…` erreichbar — Sprachpräfix der abgelösten
        CakePHP-App, keine Übersetzung (siehe docs/LEGACY_API_SPECIFICATION.md).

        Die abgelöste CakePHP-Anwendung bildete `/rest_sichtungen` mit
        `Router::mapResources()` ab; `GET` traf dort auf `index()`, und diese
        Aktion bestand aus denselben zwei Zeilen wie `showReports()`.
        Antwortformat, Sortierung, Limit und die Datenschutz-Regeln sind
        identisch — maßgeblich ist die Beschreibung unter
        `/sichtungen/showreports.json`. Es ist wörtlich dieselbe Funktion,
        keine zweite Umsetzung; die Parameter unten sind deshalb absichtlich
        Zeichen für Zeichen dieselben.

        Die angebundene iOS-App (`OstSeeTiere/8`) lädt ihre Karte über diesen
        Pfad. Bis 2026-08 antwortete er mit `405`.
      parameters:
        - name: year
          in: query
          description: 'Jahr der Sichtungen (Standard: aktuelles Jahr bis März, sonst Vorjahr)'
          schema:
            type: integer
            minimum: 2000
            maximum: 2030
            example: 2024
        - name: location
          in: query
          description: 'Zentrumskoordinaten für Umkreissuche "breitengrad,längengrad"'
          schema:
            type: string
            pattern: '^-?\d+\.?\d*,-?\d+\.?\d*$'
            example: "54.0,13.0"
        - name: distance
          in: query
          description: 'Suchradius in Metern (nur mit location Parameter)'
          schema:
            type: integer
            minimum: 1000
            maximum: 500000
            default: 100000
            example: 50000
        - name: bbox
          in: query
          description: 'Begrenzungsbox "minLon,minLat,maxLon,maxLat" (OpenLayers-kompatibel)'
          schema:
            type: string
            pattern: '^-?\d+\.?\d*,-?\d+\.?\d*,-?\d+\.?\d*,-?\d+\.?\d*$'
            example: "9,53,31,66"
        - name: search
          in: query
          description: >
            Suchtext (Teilstring-Suche). Für nicht angemeldete Aufrufer werden
            Vorname/Name nur bei vorliegender Namensfreigabe und der Schiffsname
            nur bei vorliegender Schiffsnamensfreigabe durchsucht; die
            E-Mail-Adresse wird nicht durchsucht. Angemeldete Admins durchsuchen
            zusätzlich die E-Mail-Adresse und ohne Freigabe-Filter.
          schema:
            type: string
            maxLength: 100
            example: "Schneider"
      responses:
        '200':
          description: Liste der Sichtungen im PDF-konformen Kurzformat
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PDFCompliantSightingResponse'
    post:
      tags:
        - legacy
      summary: '[LEGACY] Sichtung anlegen'
      description: |
        **Legacy REST API Endpunkt für Mobile App Kompatibilität**

        Zusätzlich unter `/de/…` und `/en/…` erreichbar — Sprachpräfix der abgelösten
        CakePHP-App, keine Übersetzung (siehe docs/LEGACY_API_SPECIFICATION.md).
        
        Erstellt eine neue Sichtung im Legacy-Format der ursprünglichen schweinswalsichtung.de API.
        
        Wichtige Hinweise:
        - Unterstützt das kombinierte Datetime-Format "YYYY-MM-DD HH:MI" (deutsche Ortszeit, Europe/Berlin)
        - Feldnamen müssen exakt dem PDF-Spezifikation entsprechen
        - Boolean-Werte werden als 0/1 Integer übertragen
        - Totfunde werden durch `anzahl_gesamt = 0` signalisiert
        
        Erfolgsantwort: HTTP 201 mit Location-Header und `{"message": "Saved"}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacySightingRequest'
      responses:
        '201':
          description: Sichtung erfolgreich erstellt
          headers:
            Location:
              description: URL zur erstellten Ressource
              schema:
                type: string
                format: uri
                example: "/rest_sichtungen/view/1840.json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyCreateResponse'
        '200':
          description: >-
            Unlesbarer Request-Body (weder JSON noch Formulardaten). Dieser Pfad
            antwortet bewusst mit **200**, nicht mit 400 — Verhalten dieser
            Implementierung, keine Zusage des Originaldokuments. Der Body hat
            die flache Legacy-Form mit `message` als String.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              example:
                message: "No data send."
        '400':
          description: >-
            Validierungsfehler. Flache Legacy-Form: `message` als String,
            Feldfehler daneben unter `errors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              example:
                message: "Validation failed."
                errors:
                  anzahl_gesamt:
                    - "Dieses Feld kann nicht leer gelassen werden."
        '405':
          description: Methode nicht erlaubt
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Method not allowed"
                  message:
                    type: string
                    example: "Only POST method is supported for this endpoint"
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          description: >-
            Interner Serverfehler. Dieser Legacy-Endpunkt verwendet NICHT das
            generische `ErrorResponse`-Schema der modernen API: Ein
            fehlgeschlagener Schreibvorgang liefert `{"error": …, "message": …}`,
            ein unerwarteter Fehler die flache Legacy-Fehlerform
            (`LegacyErrorResponse`).
          content:
            application/json:
              schema:
                # anyOf, nicht oneOf: `{"error": …, "message": …}` erfüllt auch
                # LegacyErrorResponse (dort ist nur `message` Pflicht), womit
                # oneOf ("genau eines") fehlschlagen würde.
                anyOf:
                  - $ref: '#/components/schemas/LegacyErrorResponse'
                  - type: object
                    required:
                      - error
                      - message
                    properties:
                      error:
                        type: string
                        example: "Failed to save sighting"
                      message:
                        type: string
                        example: "Internal server error occurred"

  /rest_sichtungen/antworten.json:
    get:
      tags:
        - legacy
      summary: '[LEGACY] Antwortmöglichkeiten abrufen'
      description: |
        **Legacy REST API Endpunkt für Dropdown-Optionen**

        Zusätzlich unter `/de/…` und `/en/…` erreichbar — Sprachpräfix der abgelösten
        CakePHP-App, keine Übersetzung (siehe docs/LEGACY_API_SPECIFICATION.md).
        
        Stellt alle verfügbaren Optionen für numerische Felder bereit, genau wie in der ursprünglichen API.
        Die Feldnamen und Werte entsprechen exakt der PDF-Spezifikation.
        
        Enthält: tierart, vonwo, entfernung, verteilung, verhalten, seegang, windrichtung, 
        windstaerke, sichtweite, bootsantrieb, eingangskanal, totfund_zustand, totfund_geschlecht
      responses:
        '200':
          description: Dropdown-Optionen erfolgreich abgerufen
          headers:
            Cache-Control:
              description: Cache-Einstellungen
              schema:
                type: string
                example: "public, max-age=3600"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyResponseOptions'
        '405':
          description: Methode nicht erlaubt
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "MethodNotAllowed"
                  message:
                    type: string
                    example: "Only GET method is supported for this endpoint"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rest_sichtungen/inBaltic.json:
    get:
      tags:
        - legacy
      summary: '[LEGACY] Position prüfen'
      description: |
        **Legacy REST API Endpunkt für Koordinaten-Validierung**

        Zusätzlich unter `/de/…` und `/en/…` erreichbar — Sprachpräfix der abgelösten
        CakePHP-App, keine Übersetzung (siehe docs/LEGACY_API_SPECIFICATION.md).
        
        Überprüft, ob gegebene Koordinaten in der Ostsee bzw. im Kartenbereich liegen.
        
        Format der location Parameter: "breitengrad,längengrad" (Dezimalgrad, Komma-getrennt)
        Antwort-Feldnamen sind lowercase für Legacy-Kompatibilität: `inbaltic`, `inchartarea`
      parameters:
        - name: location
          in: query
          required: true
          description: 'Koordinaten im Format "breitengrad,längengrad"'
          schema:
            type: string
            pattern: '^-?\d+\.?\d*,-?\d+\.?\d*$'
            example: "54.3233,13.0814"
      responses:
        '200':
          description: Koordinaten erfolgreich validiert
          headers:
            Cache-Control:
              description: Cache-Einstellungen
              schema:
                type: string
                example: "public, max-age=300"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyLocationResponse'
        '400':
          description: Ungültige Parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "InvalidCoordinates"
                  message:
                    type: string
                    example: "Coordinates must be valid numbers"
        '405':
          description: Methode nicht erlaubt
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "MethodNotAllowed"
                  message:
                    type: string
                    example: "Only GET method is supported for this endpoint"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sichtungen/showreports.json:
    get:
      tags:
        - legacy
      summary: '[LEGACY] Sichtungsdaten abrufen'
      description: |
        **Legacy REST API Endpunkt für genehmigte Sichtungen**

        Zusätzlich unter `/de/…` und `/en/…` erreichbar — Sprachpräfix der abgelösten
        CakePHP-App, keine Übersetzung (siehe docs/LEGACY_API_SPECIFICATION.md).
        
        Gibt alle genehmigten Sichtungen zurück, mit optionaler Filterung nach Jahr, 
        Standort, Entfernung und Suchbegriffen.
        
        **WICHTIG: PDF-konforme abgekürzte Feldnamen**
        - ts: Unix Timestamp
        - id: Sichtungs-ID
        - dt: Datum (DD.MM.YY), deutsche Ortszeit (Europe/Berlin)
        - ti: Zeit (HH:MI), deutsche Ortszeit (Europe/Berlin)
        - lat, lon: Koordinaten als STRINGS
        - ct: Gesamtanzahl
        - yo: Jungtiere
        - sh: Schiffsname (nur bei Einverständnis)
        - na: Name (nur bei Einverständnis)
        - ar: Gebiet/Gewässer
        - ta: Tierart als deutsches Label (Erweiterung über Original-PDF hinaus)
        - tf: Totfund-Flag 0/1 (Erweiterung über Original-PDF hinaus)

        **Sortierung und Umfang**

        Sortiert nach `sichtungsdatum` absteigend, bei gleichem Zeitpunkt nach `id`
        absteigend. Das zweite Kriterium ist notwendig, weil `sichtungsdatum` nicht
        eindeutig ist; ohne es liefert dieselbe Anfrage unterschiedliche Antworten.

        Die Antwort ist auf **1000 Sichtungen** begrenzt. Diese Grenze greift im
        Normalbetrieb auch ohne Filter — Clients, die einen vollständigen Bestand
        erwarten, müssen über `year` einschränken.
      parameters:
        - name: year
          in: query
          description: 'Jahr der Sichtungen (Standard: aktuelles Jahr bis März, sonst Vorjahr)'
          schema:
            type: integer
            minimum: 2000
            maximum: 2030
            example: 2024
        - name: location
          in: query
          description: 'Zentrumskoordinaten für Umkreissuche "breitengrad,längengrad"'
          schema:
            type: string
            pattern: '^-?\d+\.?\d*,-?\d+\.?\d*$'
            example: "54.0,13.0"
        - name: distance
          in: query
          description: 'Suchradius in Metern (nur mit location Parameter)'
          schema:
            type: integer
            minimum: 1000
            maximum: 500000
            default: 100000
            example: 50000
        - name: bbox
          in: query
          description: 'Begrenzungsbox "minLon,minLat,maxLon,maxLat" (OpenLayers-kompatibel)'
          schema:
            type: string
            pattern: '^-?\d+\.?\d*,-?\d+\.?\d*,-?\d+\.?\d*,-?\d+\.?\d*$'
            example: "9,53,31,66"
        - name: search
          in: query
          description: >
            Suchtext (Teilstring-Suche). Für nicht angemeldete Aufrufer werden
            Vorname/Name nur bei vorliegender Namensfreigabe und der Schiffsname
            nur bei vorliegender Schiffsnamensfreigabe durchsucht; die
            E-Mail-Adresse wird nicht durchsucht. Angemeldete Admins durchsuchen
            zusätzlich die E-Mail-Adresse und ohne Freigabe-Filter.
            LIKE-Platzhalter (%, _ und der Escape-Backslash \) werden literal
            gesucht.
          schema:
            type: string
            maxLength: 100
            example: "Schneider"
      responses:
        '200':
          description: Sichtungsliste erfolgreich abgerufen
          headers:
            Cache-Control:
              description: Cache-Einstellungen
              schema:
                type: string
                example: "public, max-age=300"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PDFCompliantSightingResponse'
        '400':
          description: Ungültige Parameter (Jahr, Location, BBox)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "InvalidYear"
                  message:
                    type: string
                    example: "Year must be between 2000 and 2030"
        '405':
          description: Methode nicht erlaubt
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "MethodNotAllowed"
                  message:
                    type: string
                    example: "Only GET method is supported for this endpoint"
        '500':
          description: Datenbankfehler
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "DatabaseError"
                  message:
                    type: string
                    example: "Failed to retrieve sightings"

  /uploads/{path}:
    get:
      tags:
        - media
      summary: Upload-Dateien bereitstellen
      description: |
        Stellt hochgeladene Dateien bereit. Für lokalen Storage werden Dateien direkt ausgeliefert,
        für Cloud Storage erfolgt eine Weiterleitung zur Cloud-URL.

        **Zugriffskontrolle:**
        - Validierung des Dateipfads
        - Öffentlicher Zugriff nur für freigegebene Sichtungen; nicht freigegebene
          Medien sind ausschließlich für Admins zugänglich.
        - Für nicht gefundene ODER nicht freigegebene Dateien wird 404 zurückgegeben
          (die Existenz wird nicht preisgegeben).
        - Rate-Limiting je nach Authentifizierungsstatus (anonym / authentifiziert).
        - Cache-Optimierung für statische Inhalte
        - Support für lokalen und Cloud-Storage
      parameters:
        - name: path
          in: path
          required: true
          description: Relativer Pfad zur Upload-Datei
          schema:
            type: string
            example: "2024/01/image_123.jpg"
      responses:
        '200':
          description: Datei erfolgreich bereitgestellt (lokaler Storage)
          headers:
            Content-Type:
              description: MIME-Type der Datei
              schema:
                type: string
                example: "image/jpeg"
            Content-Length:
              description: Dateigröße in Bytes
              schema:
                type: integer
                example: 1024000
            Cache-Control:
              description: |
                Cache-Einstellungen. `public, max-age=86400` für genehmigte
                Dateien, `private, no-store` für nicht genehmigte (nur per
                Admin-Zugriff erreichbar).
              schema:
                type: string
                enum:
                  - "public, max-age=86400"
                  - "private, no-store"
            ETag:
              description: Entity Tag für Caching
              schema:
                type: string
                example: '"abc123def456"'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          description: Weiterleitung zu Cloud Storage URL
          headers:
            Location:
              description: Cloud Storage URL
              schema:
                type: string
                format: uri
            Cache-Control:
              description: >-
                Cache-Einstellungen. Freigegebene Medien werden langfristig
                öffentlich gecacht; nicht freigegebene (nur für Admins
                sichtbare) Medien dürfen nicht in geteilten Caches landen.
              schema:
                type: string
                enum:
                  - "public, max-age=31536000, immutable"
                  - "private, no-store"
        '400':
          description: Ungültiger Dateipfad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Ungültiger Dateipfad"
        '403':
          description: Dateityp nicht erlaubt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Dateityp nicht erlaubt"
        '404':
          description: >-
            Datei nicht gefunden oder nicht freigegeben (nicht freigegebene Dateien
            liefern für nicht-Admins 404, um die Existenz nicht preiszugeben).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Datei nicht gefunden"
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/csp-report:
    post:
      tags:
        - security
      summary: CSP Violation Report
      description: |
        Endpunkt für Content Security Policy Violation Reports.

        **Sicherheit:**
        - Rate-Limiting gegen Log-Flooding (unauthentifizierter Endpunkt): 60 Reports
          pro Minute und IP.
        - Übergroße Payloads (Content-Length > 8 KB) werden verworfen und mit
          204 No Content beantwortet (kein Ressourcen-/Log-Missbrauch).
        - Es werden ausschließlich bekannte CSP-Felder geloggt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csp-report:
                  type: object
                  description: CSP Violation Report Objekt
      responses:
        '204':
          description: >-
            Report erfolgreich empfangen. Wird auch zurückgegeben, wenn die Payload
            die maximale Größe (8 KB) überschreitet und verworfen wird.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

components:
  securitySchemes:
    cleanupToken:
      type: http
      scheme: bearer
      description: >
        Wert der Umgebungsvariablen `CLEANUP_TOKEN` (mindestens 32 Zeichen).
        Ist sie nicht gesetzt, ist dieser Zugang abgeschaltet.

    adminAuth:
      type: apiKey
      in: cookie
      name: auth-cookie
      description: >
        Session-Cookie für Admin-Authentifizierung.

        Der Wert ist ein opakes Zufalls-Token (32 Byte, base64url) ohne eigenen Inhalt —
        kein JWT. Der Session-Zustand (Identität, Rollen, Ablauf) liegt serverseitig in
        der Tabelle `sessions`; das Cookie ist nur der Schlüssel darauf. Es trägt damit
        keine Identitätsdaten mehr und lässt sich nicht dekodieren.

        Der Cookie-Name ist der Default-Wert (`auth-cookie`) und kann per
        `COOKIE_NAME` Umgebungsvariable überschrieben werden.

  parameters:
    ExportDateFrom:
      name: fromDate
      in: query
      description: Startdatum (YYYY-MM-DD)
      schema:
        type: string
        format: date
        example: "2024-01-01"

    ExportDateTo:
      name: toDate
      in: query
      description: Enddatum (YYYY-MM-DD)
      schema:
        type: string
        format: date
        example: "2024-12-31"
    
    ExportEntryChannel:
      name: entryChannel
      in: query
      description: Eingangskanal filtern (0=Web, 1=E-Mail, 2=Post, 3=Fax, 4=App, 5=Telefon, 'all' oder leer = kein Filter)
      schema:
        type: string
        example: "0"

    ExportMediaUpload:
      name: mediaUpload
      in: query
      description: >-
        Medienupload-Filter (1=mit Aufnahme, 0=ohne Aufnahme,
        announced_missing=Foto laut App angekündigt, aber keine Datei
        angehängt — der Melder reicht es separat per E-Mail nach)
      schema:
        type: string
        enum: ["0", "1", "announced_missing"]
        example: "1"

    ExportVerified:
      name: verified
      in: query
      description: Nur verifizierte Sichtungen
      schema:
        type: boolean
        example: true

    ExportBalticSea:
      name: balticSea
      in: query
      description: >-
        Ostsee-Status filtern (baltic=Ostsee, edge=Widerspruch zwischen den
        Flags, outside=außerhalb, noPosition=ohne Position; siehe
        getBalticSeaStatus() in $lib/utils/geo/balticSeaStatus.ts; leer = kein
        Filter)
      schema:
        type: string
        enum: ["baltic", "edge", "outside", "noPosition"]
        example: "baltic"

    ExportDeadFinding:
      name: deadFinding
      in: query
      description: >-
        Meldeart filtern (1=Totfund, 0=Lebendsichtung; leer = kein Filter).
        Totfund heißt totfund <> 0 — dieselbe Boolean-Semantik wie die
        Kennzeichnung in der Admin-Tabelle (deadFindingFilter.ts).
      schema:
        type: string
        enum: ["0", "1"]
        example: "1"

    ExportSearch:
      name: q
      in: query
      description: >-
        Freitext-Suche über Referenz-ID, E-Mail, Vor- und Nachname und
        Fahrwasser (ILIKE, Teiltreffer; leer = kein Filter). Dieselbe Bedingung
        wie die Suche in der Admin-Tabelle (sightingSearchFilter.ts) — der
        Export liefert damit genau die Menge, die dort angezeigt wird.
      schema:
        type: string
        example: "müller"

  schemas:
    SightingStatusLogEntry:
      type: object
      description: >
        Ein Eintrag der Status-Historie (`sichtung_status_log`). Geschrieben
        ausschließlich von PATCH /api/sightings/{id}/verify, in derselben
        Transaktion wie die Statusspalten.
      required:
        - id
        - verdict
        - editor
        - recordedAt
      properties:
        id:
          type: integer
          example: 17
        verdict:
          type: string
          enum: [approve, reject, reset]
          description: Die getroffene Entscheidung
          example: approve
        editor:
          type: string
          nullable: true
          description: >
            Kennung des Bearbeiters — dieselbe wie in `freigegeben_von` /
            `abgelehnt_von` (E-Mail-Adresse aus der Anmeldung). null, wenn keine
            Identität bekannt war; es wird kein Platzhalter erfunden.
          example: pruefer@example.com
        recordedAt:
          type: string
          format: date-time
          example: "2026-08-08T09:12:44.000Z"
    QueueNeighbor:
      type: object
      nullable: true
      description: >
        Ein Nachbar im Stapel der offenen Sichtungen, oder null am Stapelende.
      required:
        - id
        - referenceId
      properties:
        id:
          type: integer
          example: 501
        referenceId:
          type: string
          nullable: true
          description: >
            Fachliche Referenz-ID; null bei Altbestand ohne Referenz-ID
            (Spalte `referenz_id` ist nicht `notNull`).
          example: REF-501
    SpamCheckResponse:
      type: object
      required: [stored, recomputed, anonymized]
      properties:
        anonymized:
          type: boolean
          description: >-
            Die Sichtung ist anonymisiert. Die Neuberechnung lief dann ohne
            Name und E-Mail und fällt systematisch zu mild aus; `stored` ist
            davon nicht betroffen.
        stored:
          nullable: true
          description: >-
            Persistierter Befund zum Meldezeitpunkt. null heißt "nie bewertet"
            (Altbestand, Legacy-Eingang) und ist nicht dasselbe wie Score 0.
            Kein isHighRisk: das ist kein gespeichertes Feld, sondern wird aus
            der Schwelle 5 rekonstruiert.
          allOf:
            - $ref: '#/components/schemas/SpamStoredFinding'
        recomputed:
          $ref: '#/components/schemas/SpamCheckResult'
    SpamStoredFinding:
      type: object
      required: [score, indicators]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 10
        indicators:
          type: array
          items:
            type: string
          description: >-
            Immer Strings: die Spalte spam_indicators ist untypisiertes jsonb
            und wird beim Lesen auf String-Elemente gefiltert (kein Array-Wert
            oder ein Element anderen Typs fällt weg). Der Score bleibt davon
            unberührt gültig — er steht in einer eigenen Spalte.
          example: ['Formular verdächtig schnell abgeschickt']
    ReporterHistoryResponse:
      type: object
      required: [history]
      properties:
        history:
          nullable: true
          description: >-
            null heißt "nicht ermittelbar" (keine Adresse, Abfrage
            fehlgeschlagen) und ist nicht dasselbe wie ein Aggregat aus Nullen.
          allOf:
            - $ref: '#/components/schemas/ReporterHistory'
    ReporterHistory:
      type: object
      required: [approved, rejected, open, since]
      properties:
        approved:
          type: integer
          minimum: 0
          description: Andere Meldungen dieser Adresse, die freigegeben wurden.
        rejected:
          type: integer
          minimum: 0
          description: Andere Meldungen dieser Adresse, die abgelehnt wurden.
        open:
          type: integer
          minimum: 0
          description: Andere Meldungen dieser Adresse, die noch offen sind.
        since:
          type: string
          nullable: true
          format: date-time
          description: >-
            Früheste Meldung dieser Adresse in UTC, inklusive der aktuellen.
    SpamCheckResult:
      type: object
      required: [score, isHighRisk, indicators]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 10
        isHighRisk:
          type: boolean
          description: Urteil des Servers (Schwelle 5), nicht clientseitig nachrechnen.
        indicators:
          type: array
          items:
            type: string
        failed:
          type: boolean
          description: >-
            Die Prüfung selbst ist gescheitert (Fail-Safe). Dann gilt score 0
            zusammen mit isHighRisk true — beides wörtlich zu nehmen ergäbe
            "Hochrisiko ohne einen einzigen Indikator". Für die Anzeige ist der
            ehrliche Zustand derselbe wie stored null: es wurde nichts bewertet.
    ReporterHashReport:
      type: object
      required: [hashed, skipped, remaining, done, stalled]
      properties:
        hashed:
          type: integer
          description: >-
            Zeilen, die in diesem Lauf tatsächlich einen Hash bekommen haben.
            Geschrieben wird nur, wenn sich die Zeile seit dem Lesen nicht
            geändert hat.
        skipped:
          type: integer
          description: >-
            Geladene Zeilen, deren Adresse nach der Normalisierung leer ist
            (z. B. nur Weißraum). Sie bekommen keinen Hash.
        remaining:
          type: integer
          description: Danach noch offene Zeilen (mit Adresse, ohne Hash, nicht anonymisiert).
        done:
          type: boolean
          description: >-
            true, wenn weniger Zeilen als das Limit geladen wurden oder der
            Batch festgefahren ist — nicht erneut aufrufen.
        stalled:
          type: boolean
          description: >-
            true, wenn jede geladene Zeile des Batches übersprungen wurde
            (`skipped`). Weitere Aufrufe läsen dieselben Zeilen wieder. Leere
            Updates wegen paralleler Änderungen zählen nicht dazu.
    AnonymizationReport:
      type: object
      required:
        - mode
        - executed
        - skipped
        - keyConfigured
        - activatedAt
        - due
        - newestDueReceivedAt
        - byYear
        - pendingHashes
        - hashed
        - anonymized
        - remaining
        - done
      properties:
        mode:
          type: string
          enum: [preview, execute]
        executed:
          type: boolean
          description: true nur, wenn in diesem Aufruf tatsächlich geleert werden durfte.
        skipped:
          type: string
          nullable: true
          enum: [not_activated, hash_backfill_incomplete, null]
          description: Grund, warum bei `mode=execute` nichts geleert wurde.
        keyConfigured:
          type: boolean
          description: '`REPORTER_HASH_KEY` ist gesetzt und lang genug.'
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: Zeitpunkt der einmaligen Freischaltung, `null` solange nicht freigeschaltet.
        due:
          type: integer
          description: Fällige Sichtungen vor diesem Aufruf.
        newestDueReceivedAt:
          type: string
          format: date-time
          nullable: true
          description: Eingang der jüngsten fälligen Sichtung — die tatsächliche Grenze.
        byYear:
          type: array
          description: Aufschlüsselung der fälligen Sichtungen nach Eingangsjahr (Berliner Zeit).
          items:
            type: object
            required: [year, total, namesCleared, namesKept, shipsCleared, shipsKept, pending]
            properties:
              year:
                type: integer
              total:
                type: integer
              namesCleared:
                type: integer
                description: Name vorhanden, ohne Einwilligung — wird geleert.
              namesKept:
                type: integer
                description: Name vorhanden, mit Einwilligung — bleibt.
              shipsCleared:
                type: integer
              shipsKept:
                type: integer
              pending:
                type: integer
                description: Davon noch nicht freigegeben.
        pendingHashes:
          type: integer
          description: Sichtungen mit Adresse, aber ohne Melder-Hash — vor diesem Aufruf.
        hashed:
          type: integer
          description: In diesem Aufruf nachgeholte Melder-Hashes.
        anonymized:
          type: integer
          description: In diesem Aufruf anonymisierte Sichtungen.
        remaining:
          type: integer
          description: Danach noch fällige Sichtungen.
        done:
          type: boolean
          description: '`false` heißt: erneut aufrufen.'
    ErasureReport:
      type: object
      required: [mode, matched, alreadyAnonymized, erased]
      properties:
        mode:
          type: string
          enum: [preview, execute]
        matched:
          type: integer
          description: Sichtungen dieser Person.
        alreadyAnonymized:
          type: integer
          description: Davon schon vorher anonymisiert.
        erased:
          type: integer
          description: In diesem Aufruf bearbeitet (0 in der Vorschau).
    SpamRescoreReport:
      type: object
      required: [scored, skippedFailed, lastId, remaining, done, stalled, distribution]
      properties:
        scored:
          type: integer
          description: Zeilen, die in diesem Lauf einen Score bekommen haben.
        skippedFailed:
          type: integer
          description: >-
            Zeilen mit fehlgeschlagener Prüfung. Sie bleiben NULL — ein Score 0
            läse sich als "geprüft, sauber" und wäre die falsche Aussage.
        lastId:
          type: integer
          nullable: true
          description: Höchste in diesem Lauf bearbeitete Sichtungs-ID.
        remaining:
          type: integer
          description: Noch unbewertete Zeilen nach diesem Lauf.
        done:
          type: boolean
          description: >-
            true, wenn der Aufrufer aufhören soll: Menge geleert (weniger
            Zeilen als das Limit) ODER stalled. Nicht aus remaining abgeleitet
            — übersprungene Zeilen bleiben NULL und würden remaining nie auf 0
            fallen lassen.
        stalled:
          type: boolean
          description: >-
            true, wenn ein voller Batch gar nichts geschrieben hat (alle
            Prüfungen fehlgeschlagen). Weitere Aufrufe würden dieselben Zeilen
            laden; done ist dann ebenfalls true. Ursache im Server-Log suchen.
        distribution:
          type: object
          additionalProperties:
            type: integer
          description: Score → Anzahl in diesem Lauf.
          example: { '0': 187, '2': 11, '10': 2 }

    CleanupReport:
      type: object
      description: Ergebnis eines Aufräum-Laufs für verwaiste Uploads.
      properties:
        retentionHours:
          type: number
          description: Tatsächlich verwendete Frist nach der Klemmung.
        rowsFound:
          type: integer
        filesFound:
          type: integer
          nullable: true
          description: '`null` = für diesen Storage-Provider nicht anwendbar.'
        rowsDeleted:
          type: integer
        filesDeleted:
          type: integer
        failed:
          type: integer
        remaining:
          type: integer
          description: Vom Deckel übrig gelassene Fundstücke; erneut aufrufen.
        sessionsRemoved:
          type: integer
          description: >
            Im selben Lauf gelöschte abgelaufene oder widerrufene Session-Zeilen.
            Nur bei `mode=execute` größer als 0.

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Fehlermeldung
          example: "Ein Fehler ist aufgetreten"
    PublicSighting:
      type: object
      description: Öffentlich verfügbare Sichtungsdaten
      required:
        - id
        - ts
        - dt
        - ti
        - lat
        - lon
        - ct
        - ta
        - tf
      properties:
        id:
          type: integer
          description: Eindeutige ID der Sichtung
          example: 1840
        ts:
          type: integer
          format: int64
          description: Unix Timestamp der Erstellung
          example: 1672531200
        dt:
          type: string
          description: Datum der Sichtung (DD.MM.YYYY), Kalendertag in deutscher Ortszeit (Europe/Berlin)
          example: "01.01.2024"
        ti:
          type: string
          description: Uhrzeit der Sichtung (HH:MM), deutsche Ortszeit (Europe/Berlin)
          example: "14:30"
        lat:
          type: number
          format: float
          description: Breitengrad
          example: 54.3233
        lon:
          type: number
          format: float
          description: Längengrad
          example: 13.0814
        ct:
          type: integer
          description: Anzahl der Tiere
          minimum: 0
          example: 3
        yo:
          type: integer
          nullable: true
          description: Anzahl der Jungtiere
          minimum: 0
          example: 1
        ta:
          type: integer
          description: Tierart (1=Schweinswal, 2=Kegelrobbe, etc.)
          minimum: 1
          example: 1
        tf:
          type: integer
          description: Totfund (0=nein, 1=ja)
          enum: [0, 1]
          example: 0
        na:
          type: string
          nullable: true
          description: Name des Melders (nur wenn Einverständnis gegeben)
          example: "Max Mustermann"
        ar:
          type: string
          nullable: true
          description: Gebiet/Gewässer
          example: "Greifswalder Bodden"
        sh:
          type: string
          nullable: true
          description: Schiffsname (nur wenn Einverständnis gegeben)
          example: "MS Baltic"

    DetailedSighting:
      type: object
      description: Vollständige Sichtungsdaten (Admin-Zugriff)
      required:
        - id
        - sightingDate
        - created
        - species
        - totalCount
        - latitude
        - longitude
      properties:
        id:
          type: integer
          description: Eindeutige ID der Sichtung
          example: 1840
        sightingDate:
          type: string
          format: date-time
          description: Datum und Uhrzeit der Sichtung
          example: "2024-01-01T14:30:00Z"
        created:
          type: string
          format: date-time
          description: Erstellungszeitpunkt der Meldung
          example: "2024-01-01T15:00:00Z"
        species:
          type: integer
          description: Tierart
          minimum: 0
          example: 0
        totalCount:
          type: integer
          description: Gesamtanzahl der Tiere
          minimum: 0
          example: 3
        juvenileCount:
          type: integer
          nullable: true
          description: Anzahl der Jungtiere
          minimum: 0
          example: 1
        isDead:
          type: integer
          description: Totfund (0=nein, 1=ja)
          enum: [0, 1]
          example: 0
        latitude:
          type: number
          format: float
          description: Breitengrad
          example: 54.3233
        longitude:
          type: number
          format: float
          description: Längengrad
          example: 13.0814
        distance:
          type: integer
          nullable: true
          description: Entfernung in Metern
          minimum: 0
          example: 500
        distribution:
          type: integer
          nullable: true
          description: Verteilung der Tiere
          example: 1
        waterway:
          type: string
          nullable: true
          description: Gewässer
          example: "Greifswalder Bodden"
        firstName:
          type: string
          nullable: true
          description: Vorname des Melders
          example: "Max"
        lastName:
          type: string
          nullable: true
          description: Nachname des Melders
          example: "Mustermann"
        email:
          type: string
          format: email
          nullable: true
          description: E-Mail des Melders
          example: "max@example.com"
        phone:
          type: string
          nullable: true
          description: Telefonnummer des Melders
          example: "+49 123 456789"
        shipName:
          type: string
          nullable: true
          description: Schiffsname
          example: "MS Baltic"
        verified:
          type: integer
          description: Verifizierungsstatus (0=nicht verifiziert, 1=verifiziert)
          enum: [0, 1]
          example: 1
        approvedAt:
          type: string
          format: date-time
          nullable: true
          description: Zeitpunkt der Genehmigung
          example: "2024-01-02T10:00:00Z"
        mediaUpload:
          type: integer
          description: Hat Medien-Upload (0=nein, 1=ja)
          enum: [0, 1]
          example: 1
        entryChannel:
          type: integer
          nullable: true
          description: Eingangskanal der Meldung
          example: 1
        nameConsent:
          type: integer
          description: Einverständnis zur Namensveröffentlichung
          enum: [0, 1]
          example: 1
        nameConsentAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Zeitpunkt der Einwilligung zur Namensveröffentlichung (Nachweis nach
            Art. 7 Abs. 1 DSGVO). `null`, wenn nicht eingewilligt wurde oder der
            Datensatz aus dem Altbestand vor Einführung des Nachweises stammt.
          example: "2026-07-31T10:30:00Z"
        nameConsentVersion:
          type: string
          nullable: true
          description: >-
            Fassung des Einwilligungstextes, dem zugestimmt wurde. `null` unter
            denselben Bedingungen wie `nameConsentAt`.
          maxLength: 32
          example: "2025-08-12"
        shipNameConsent:
          type: integer
          description: Einverständnis zur Schiffsnamen-Veröffentlichung
          enum: [0, 1]
          example: 1
        shipNameConsentAt:
          type: string
          format: date-time
          nullable: true
          description: Zeitpunkt der Einwilligung zur Schiffsnamen-Veröffentlichung
          example: "2026-07-31T10:30:00Z"
        shipNameConsentVersion:
          type: string
          nullable: true
          description: Fassung des zugestimmten Einwilligungstextes
          maxLength: 32
          example: "2025-08-12"
        privacyConsent:
          type: integer
          description: Pflicht-Einwilligung zur Datenverarbeitung
          enum: [0, 1]
          example: 1
        privacyConsentAt:
          type: string
          format: date-time
          nullable: true
          description: Zeitpunkt der Pflicht-Einwilligung
          example: "2026-07-31T10:30:00Z"
        privacyConsentVersion:
          type: string
          nullable: true
          description: Fassung des zugestimmten Einwilligungstextes
          maxLength: 32
          example: "2026-07-28"
        mediaConsent:
          type: integer
          description: Einwilligung zur Veröffentlichung hochgeladener Aufnahmen
          enum: [0, 1]
          example: 1
        mediaConsentAt:
          type: string
          format: date-time
          nullable: true
          description: Zeitpunkt der Medien-Einwilligung
          example: "2026-07-31T10:30:00Z"
        mediaConsentVersion:
          type: string
          nullable: true
          description: Fassung des zugestimmten Einwilligungstextes
          maxLength: 32
          example: "2026-07-28"
        internalComment:
          type: string
          nullable: true
          description: Interner Kommentar (Admin-only)
          example: "Bestätigt durch Foto"
        files:
          type: array
          description: Zugehörige Dateien
          items:
            $ref: '#/components/schemas/SightingFile'

    SightingFormData:
      type: object
      description: >
        Formulardaten für neue oder geänderte Sichtung.


        Ortsangabe: Entweder GPS-Koordinaten (`latitude` + `longitude`, dann
        `hasPosition: true`) ODER eine Beschreibung des Seegebiets (`waterway`).
        Fehlen beide, wird die Sichtung mit VALIDATION_ERROR abgelehnt.
      required:
        - sightingDate
        - species
        - totalCount
        - email
      properties:
        _formToken:
          type: string
          description: >-
            Signiertes Zeit-Token aus dem Seiten-Load der Meldeseite
            (Spam-Heuristik). Kein Formularfeld: Der Server entfernt es vor
            der Feld-Validierung. Fehlt es oder ist es ungültig, wird die
            Meldung trotzdem angenommen — es fließt nur in den gespeicherten
            Spam-Score ein.
          example: "1754550000000.9f2c…"
        sightingDate:
          type: string
          format: date-time
          description: Datum und Uhrzeit der Sichtung
          example: "2024-01-01T14:30:00Z"
        species:
          type: integer
          description: "Tierart (0 = Schweinswal, siehe /rest_sichtungen/antworten.json)"
          minimum: 0
          example: 0
        totalCount:
          type: integer
          description: Gesamtanzahl der Tiere
          minimum: 1
          example: 3
        juvenileCount:
          type: integer
          nullable: true
          description: Anzahl der Jungtiere
          minimum: 0
          example: 1
        isDead:
          type: integer
          description: Totfund (0=nein, 1=ja)
          enum: [0, 1]
          default: 0
          example: 0
        hasPosition:
          type: boolean
          description: >
            Gibt an, ob GPS-Koordinaten vorliegen. Bei `true` sind `latitude`
            und `longitude` Pflicht, bei `false` stattdessen `waterway`.
          default: false
          example: true
        latitude:
          type: number
          format: float
          description: "Breitengrad (Pflicht, wenn hasPosition = true)"
          minimum: -90
          maximum: 90
          example: 54.3233
        longitude:
          type: number
          format: float
          description: "Längengrad (Pflicht, wenn hasPosition = true)"
          minimum: -180
          maximum: 180
          example: 13.0814
        distance:
          type: integer
          nullable: true
          description: Entfernung in Metern
          minimum: 0
          example: 500
        distribution:
          type: integer
          nullable: true
          description: Verteilung der Tiere
          example: 1
        waterway:
          type: string
          nullable: true
          description: "Gewässer/Seegebiet (Pflicht, wenn keine GPS-Position vorliegt)"
          maxLength: 255
          example: "Greifswalder Bodden"
        firstName:
          type: string
          description: Vorname des Melders
          maxLength: 100
          example: "Max"
        lastName:
          type: string
          description: Nachname des Melders
          maxLength: 100
          example: "Mustermann"
        email:
          type: string
          format: email
          description: E-Mail des Melders
          maxLength: 255
          example: "max@example.com"
        phone:
          type: string
          nullable: true
          description: Telefonnummer des Melders
          maxLength: 50
          example: "+49 123 456789"
        shipName:
          type: string
          nullable: true
          description: Schiffsname
          maxLength: 100
          example: "MS Baltic"
        nameConsent:
          type: boolean
          description: Einverständnis zur Namensveröffentlichung
          default: false
          example: true
        shipNameConsent:
          type: boolean
          description: Einverständnis zur Schiffsnamen-Veröffentlichung
          default: false
          example: true
        files:
          type: array
          description: URLs der hochgeladenen Dateien
          items:
            type: string
            format: uri
            example: "/uploads/2024/01/image_123.jpg"

    SightingFile:
      type: object
      description: Datei-Metadaten zu einer Sichtung
      properties:
        id:
          type: integer
          description: Datei-ID
          example: 1
        sightingId:
          type: integer
          description: Zugehörige Sichtungs-ID
          example: 1840
        filename:
          type: string
          description: Ursprünglicher Dateiname
          example: "whale_photo.jpg"
        url:
          type: string
          format: uri
          description: URL der Datei
          example: "/uploads/2024/01/whale_photo_123.jpg"
        mimeType:
          type: string
          description: MIME-Type der Datei
          example: "image/jpeg"
        fileSize:
          type: integer
          description: Dateigröße in Bytes
          example: 2048576
        uploadedAt:
          type: string
          format: date-time
          description: Upload-Zeitpunkt
          example: "2024-01-01T15:00:00Z"
        exifData:
          type: object
          nullable: true
          description: EXIF-Metadaten (für Bilder)
          example:
            lat: 54.3233
            lon: 13.0814
            timestamp: "2024-01-01T14:30:00Z"
            camera: "Canon EOS R5"

    SightingGeoFeature:
      type: object
      description: GeoJSON Feature für Kartendarstellung
      required:
        - type
        - geometry
        - properties
      properties:
        type:
          type: string
          enum: [Feature]
          example: "Feature"
        geometry:
          type: object
          required:
            - type
            - coordinates
          properties:
            type:
              type: string
              enum: [Point]
              example: "Point"
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
              description: "[longitude, latitude]"
              example: [13.0814, 54.3233]
        properties:
          type: object
          required:
            - id
            - species
            - count
            - date
          properties:
            id:
              type: integer
              example: 1840
            species:
              type: integer
              example: 1
            count:
              type: integer
              example: 3
            juvenileCount:
              type: integer
              nullable: true
              example: 1
            isDead:
              type: boolean
              example: false
            date:
              type: string
              format: date-time
              example: "2024-01-01T14:30:00Z"
            waterway:
              type: string
              nullable: true
              example: "Greifswalder Bodden"

    FileUploadResponse:
      type: object
      required:
        - success
        - url
      properties:
        success:
          type: boolean
          example: true
        url:
          type: string
          format: uri
          description: URL der hochgeladenen Datei
          example: "/uploads/2024/01/image_123.jpg"
        filename:
          type: string
          description: Gespeicherter Dateiname
          example: "image_123.jpg"
        originalName:
          type: string
          description: Ursprünglicher Dateiname
          example: "my_photo.jpg"
        mimeType:
          type: string
          description: MIME-Type der Datei
          example: "image/jpeg"
        size:
          type: integer
          description: Dateigröße in Bytes
          example: 2048576
        exifData:
          type: object
          nullable: true
          description: Extrahierte EXIF-Daten
          example:
            lat: 54.3233
            lon: 13.0814
            timestamp: "2024-01-01T14:30:00Z"

    SightingResponse:
      type: object
      required:
        - success
        - id
      properties:
        success:
          type: boolean
          example: true
        id:
          type: integer
          description: ID der erstellten/aktualisierten Sichtung
          example: 1840
        message:
          type: string
          description: Erfolgsbestätigung
          example: "Sichtung erfolgreich gespeichert"

    SuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          description: Erfolgsmeldung
          example: "Operation erfolgreich durchgeführt"

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Fehlermeldung
          example: "Ein Fehler ist aufgetreten"
        details:
          type: array
          description: Detaillierte Fehlermeldungen
          items:
            type: string
          example: ["Feld 'email' ist erforderlich", "Ungültige Koordinaten"]

    ValidationErrorResponse:
      type: object
      description: |
        Abgelehnte Eingabe. Beide Endpunkte, die darauf verweisen
        (`POST /api/sightings` und `PUT /api/sightings/{id}`), liefern genau
        diese Hülle.

        Der Feldschlüssel entspricht dem Namen im `SightingFormData`-Schema und
        trägt **eine** Meldung, nicht mehrere: Yup läuft mit `abortEarly: false`
        und behält je Feld die zuletzt gefundene.
      required:
        - success
        - code
        - message
        - errors
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          description: Maschinenlesbare Fehlerkennung
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: |
            Menschenlesbare Meldung. `POST` nennt hier den Sammelbegriff,
            `PUT` den ersten konkreten Feldfehler — das Bearbeitungsformular
            zeigt genau diesen Text an.
          example: "Bitte wählen Sie eine gültige Entfernungskategorie."
        errors:
          type: object
          description: Feldspezifische Validierungsfehler
          additionalProperties:
            type: string
          example:
            distance: "Bitte wählen Sie eine gültige Entfernungskategorie."
            email: "Bitte geben Sie eine gültige E-Mail-Adresse ein."

    LegacySightingRequest:
      type: object
      title: Legacy Sichtungsanfrage
      description: |
        Anfrageobjekt für Legacy REST API im exakten Format der PDF-Spezifikation.
        
        **WICHTIG:** Feldnamen dürfen NICHT geändert werden - Mobile Apps sind darauf angewiesen!
      required:
        - sichtungsdatum
        - anzahl_gesamt
        - vorname
        - name
        - email
      properties:
        # Pflichtfelder
        sichtungsdatum:
          type: string
          description: >-
            Datum und Uhrzeit der Sichtung im Format "YYYY-MM-DD HH:MI"; wird als
            deutsche Ortszeit (Europe/Berlin) interpretiert, nicht als UTC
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$'
          example: "2024-01-01 14:30"
        anzahl_gesamt:
          type: integer
          description: 'Gesamtanzahl der Tiere (0 = Totfund)'
          minimum: 0
          example: 3
        vorname:
          type: string
          description: Vorname des Melders
          maxLength: 64
          example: "Max"
        name:
          type: string
          description: 'Nachname des Melders (ACHTUNG: "name" nicht "nachname"!)'
          maxLength: 64
          example: "Mustermann"
        email:
          type: string
          format: email
          description: E-Mail-Adresse des Melders
          example: "max@example.com"
        # Optionale Felder (Auszug — vollständige Liste in
        # docs/LEGACY_API_SPECIFICATION.md)
        fax:
          type: string
          description: >-
            Faxnummer. Wurde bis 2026-07-30 validiert, aber nicht gespeichert;
            das Formular bietet dafür kein Eingabefeld an.
          maxLength: 64
          example: "+49 431 123456"
        totfund:
          type: integer
          description: >-
            Totfund-Kennzeichen (0/1). Gilt zusätzlich zur Regel
            "anzahl_gesamt = 0 wird als Totfund interpretiert" — ein
            `totfund: 1` bei `anzahl_gesamt > 0` wurde bis 2026-07-30 ignoriert.
          enum: [0, 1]
          example: 1
        sonstige_auffaelligkeiten:
          type: string
          description: >-
            Sonstige Auffälligkeiten (Freitext). Vertragsname der Spezifikation,
            mit "ae" geschrieben — diese Schreibweise hat Vorrang.
          example: "Tier war deutlich verletzt"
        sonstige_auffälligkeiten:
          type: string
          deprecated: true
          description: >-
            Historische Umlaut-Schreibweise dieser Implementierung. Wird bis auf
            Weiteres akzeptiert, damit bereits gegen diese App gebaute Clients
            ihren Freitext nicht verlieren. Nicht in neuen Clients verwenden.
          example: "Tier war deutlich verletzt"
        windrichtung:
          type: string
          description: >-
            Windrichtung. Gespeichert wird ausschließlich die deutsche Form
            ('N','NW','W','SW','S','SO','O','NO'). Zusätzlich werden seit
            2026-07-30 die englischen Abkürzungen 'NE', 'E' und 'SE'
            angenommen und auf 'NO', 'O' bzw. 'SO' normalisiert — der
            angebundene iOS-Client sendet sie, und vorher ging die Windrichtung
            dabei verloren. Ein unbekannter Wert ergibt weiterhin einen leeren
            String.
          enum: ["", "N", "NW", "W", "SW", "S", "SO", "O", "NO", "NE", "E", "SE"]
          example: "NO"
        windstaerke:
          type: integer
          description: >-
            Windstärke in Beaufort. Der Bereich ist 0-12, nicht 1-12: 0 ist
            Windstille, ein realer Messwert, den der iOS-Client tatsächlich
            sendet. Bis 2026-07-30 wurde die aktiv gemeldete 0 als fehlende
            Angabe verworfen. Wird auch als String akzeptiert, weil
            Formular-Encoding jeden Wert als String überträgt.
          minimum: 0
          maximum: 12
          example: 0

    LegacyCreateResponse:
      type: object
      title: Legacy Erfolgsantwort
      description: Erfolgsantwort der Legacy API - exakt wie in PDF spezifiziert
      required:
        - message
      properties:
        message:
          type: string
          description: 'Erfolgsbestätigung - muss exakt "Saved" sein'
          enum: ["Saved"]
          example: "Saved"

    LegacyErrorResponse:
      type: object
      title: Legacy Fehlerantwort
      description: |
        Fehlerantwort der Legacy API im ursprünglichen Format — **flach**:
        `message` ist ein String, die Feldfehler liegen daneben unter `errors`.

        Verbindlich ist der Abschnitt „Bei Validierungsfehlern" des
        Originaldokuments (`docs/archive/Sichtungsdb-Web-Schnittstelle.pdf`),
        siehe auch `docs/LEGACY_API_SPECIFICATION.md`:

        ```json
        {"message": "Validation failed.", "errors": {"anzahl_gesamt": ["…"]}}
        ```

        Diese Spec beschrieb bis 2026-07-30 stattdessen `{"error": …, "message": …}`
        und kannte gar kein `errors`-Objekt.
      required:
        - message
      properties:
        message:
          type: string
          description: Allgemeine Fehlermeldung
          example: "Validation failed."
        errors:
          type: object
          description: >-
            Feldbezogene Validierungsfehler auf Deutsch. Schlüssel ist der
            Legacy-Feldname, Wert eine Liste von Meldungen. Fehlt, wenn keine
            feldbezogenen Fehler vorliegen.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            anzahl_gesamt:
              - "Dieses Feld kann nicht leer gelassen werden."

    LegacyLocationResponse:
      type: object
      title: Legacy Standortprüfung
      description: Antwort der Standortprüfung - exakte Feldnamen aus PDF
      required:
        - inbaltic
        - inchartarea
      properties:
        inbaltic:
          type: boolean
          description: 'True wenn Position in der Ostsee liegt (ACHTUNG: lowercase!)'
          example: true
        inchartarea:
          type: boolean
          description: 'True wenn Position im Kartenbereich liegt (ACHTUNG: lowercase!)'
          example: true

    LegacyResponseOptions:
      type: object
      title: Legacy Dropdown-Optionen
      description: |
        Alle verfügbaren Optionen für Dropdown-Felder der Legacy API.
        Feldnamen und Struktur entsprechen exakt der PDF-Spezifikation.
      required:
        - tierart
        - vonwo
        - entfernung
        - verteilung
        - verhalten
        - seegang
        - windrichtung
        - windstaerke
        - sichtweite
        - bootsantrieb
        - eingangskanal
        - totfund_zustand
        - totfund_geschlecht
      properties:
        tierart:
          type: object
          description: 'Verfügbare Tierarten. Schlüssel: numerischer String, Wert: Bezeichnung'
          additionalProperties:
            type: string
          example:
            "0": "Schweinswal"
            "1": "Kegelrobbe"
            "2": "Seehund"
        vonwo:
          type: object
          description: 'Sichtungsort-Optionen. Schlüssel: numerischer String, Wert: Bezeichnung'
          additionalProperties:
            type: string
          example:
            "0": "Sonstiges"
            "1": "Segelschiff"
            "3": "Land"
        entfernung:
          type: object
          description: 'Entfernungs-Optionen. Schlüssel: numerischer String, Wert: Bezeichnung'
          additionalProperties:
            type: string
          example:
            "1": "weniger als 10 Meter"
            "5": "mehr als 500 Meter"
        verteilung:
          type: object
          description: 'Verteilungs-Optionen. Schlüssel: numerischer String, Wert: Bezeichnung'
          additionalProperties:
            type: string
        verhalten:
          type: object
          description: 'Verhaltens-Optionen. Schlüssel: numerischer String, Wert: Bezeichnung'
          additionalProperties:
            type: string
        seegang:
          type: object
          description: 'Seegang-Optionen. Schlüssel: numerischer String (0–5), Wert: Bezeichnung'
          additionalProperties:
            type: string
        windrichtung:
          type: object
          description: 'Windrichtungs-Optionen. Schlüssel: Kürzel (N/NW/W/…), Wert: Bezeichnung'
          additionalProperties:
            type: string
        windstaerke:
          type: object
          description: 'Windstärke-Optionen (Beaufort). Schlüssel: numerischer String, Wert: Bezeichnung'
          additionalProperties:
            type: string
        sichtweite:
          type: object
          description: 'Sichtweiten-Optionen. Schlüssel: numerischer String (1–4), Wert: Bezeichnung'
          additionalProperties:
            type: string
        bootsantrieb:
          type: object
          description: 'Bootsantriebs-Optionen. Schlüssel: numerischer String, Wert: Bezeichnung'
          additionalProperties:
            type: string
        eingangskanal:
          type: object
          description: 'Eingangskanal-Optionen. Schlüssel: numerischer String (0–5), Wert: Bezeichnung'
          additionalProperties:
            type: string
          example:
            "0": "Web"
            "4": "App"
        totfund_zustand:
          type: object
          description: 'Totfund-Zustand-Optionen. Schlüssel: numerischer String, Wert: Bezeichnung'
          additionalProperties:
            type: string
        totfund_geschlecht:
          type: object
          description: 'Totfund-Geschlecht-Optionen. Schlüssel: numerischer String, Wert: Bezeichnung'
          additionalProperties:
            type: string
          example:
            "0": "unbekannt"
            "1": "weiblich"
            "2": "männlich"

    PDFCompliantSightingResponse:
      type: object
      title: PDF-konforme Legacy Sichtungsantwort
      description: |
        Sichtungsdaten im EXAKTEN PDF-spezifizierten Format für showreports.json Endpunkt.
        
        **KRITISCH:** Diese Feldnamen dürfen NIEMALS geändert werden - Mobile Apps sind darauf angewiesen!
        
        Alle Felder verwenden die abgekürzten Namen aus der PDF-Spezifikation.
      required:
        - ts
        - id
        - dt
        - ti
        - lat
        - lon
        - ct
        - yo
      properties:
        ts:
          type: integer
          format: int64
          description: 'Unix Timestamp der Sichtung'
          example: 1327503000
        id:
          type: integer
          description: 'Eindeutige Sichtungs-ID (Report ID)'
          example: 817
        dt:
          type: string
          description: 'Datum der Sichtung im Format DD.MM.YY (2-stelliges Jahr!), Kalendertag in deutscher Ortszeit (Europe/Berlin)'
          pattern: '^\d{2}\.\d{2}\.\d{2}$'
          example: "25.01.12"
        ti:
          type: string
          description: 'Zeit der Sichtung im Format HH:MI (24h, deutsche Ortszeit / Europe/Berlin)'
          pattern: '^\d{2}:\d{2}$'
          example: "14:50"
        lat:
          type: string
          description: 'Breitengrad als STRING (nicht number!) - PDF-Anforderung'
          example: "54.646667"
        lon:
          type: string
          description: 'Längengrad als STRING (nicht number!) - PDF-Anforderung'
          example: "11.333333"
        ct:
          type: integer
          description: 'Gesamtanzahl der Tiere (Total Count)'
          minimum: 0
          example: 1
        yo:
          type: integer
          description: 'Anzahl der Jungtiere (Young Count)'
          minimum: 0
          example: 0
        sh:
          type: string
          nullable: true
          description: 'Schiffsname (nur bei Einverständnis) - Ship Name'
          example: "Fährschiff \"Deutschland\""
        na:
          type: string
          nullable: true
          description: 'Name des Beobachters (nur bei Einverständnis) - Name'
          example: "Jörg Schneider"
        ar:
          type: string
          nullable: true
          description: 'Gebiet/Gewässer - Area'
          example: "Kieler Förde"
        ta:
          type: string
          nullable: true
          description: 'Tierart als deutsches Label (nicht im Original-PDF, aber von dieser Implementierung zurückgegeben)'
          example: "Schweinswal"
        tf:
          type: integer
          description: 'Totfund-Flag (0=keine Totfund, 1=Totfund) - nicht im Original-PDF, aber von dieser Implementierung zurückgegeben'
          enum: [0, 1]
          example: 0

    StatisticsResponse:
      type: object
      description: >-
        Aggregierte Statistiken über freigegebene Sichtungen
        (`freigegeben_am IS NOT NULL`). Nicht freigegebene Meldungen zählen nicht mit.
      required:
        - totalSightings
        - completionRate
        - averageOptionalFields
        - yearsOfService
        - uniqueUsers
        - sightingsWithMedia
        - deadAnimalsFound
      properties:
        totalSightings:
          type: integer
          description: Gesamtanzahl der Sichtungen
          example: 4821
        completionRate:
          type: number
          format: float
          description: >-
            Anteil der Sichtungen (0–100, ganzzahlig gerundet) mit mindestens einem
            beantworteten Zusatzfeld. Vorbelegte Werte („Keine Angabe") und leere
            Texte zählen nicht als Antwort.
          example: 83
        averageOptionalFields:
          type: number
          format: float
          description: >-
            Durchschnittliche Anzahl beantworteter Zusatzfelder je Sichtung
            (von 11, ganzzahlig gerundet; gleiche Zählung wie completionRate)
          example: 3
        yearsOfService:
          type: integer
          description: Jahre seit Projektbeginn
          example: 12
        uniqueUsers:
          type: integer
          description: Anzahl eindeutiger Melder
          example: 1523
        sightingsWithMedia:
          type: integer
          description: Anzahl Sichtungen mit Medien
          example: 1204
        deadAnimalsFound:
          type: integer
          description: Anzahl Totfunde
          example: 87

    MaintenanceStatus:
      type: object
      description: Aktueller Status des Wartungsmodus
      required:
        - enabled
        - message
        - timestamp
      properties:
        enabled:
          type: boolean
          description: true wenn Wartungsmodus aktiv
          example: false
        message:
          type: string
          description: Anzeigetext im Wartungsmodus
          example: "Wir sind gleich wieder da."
        timestamp:
          type: string
          format: date-time
          description: Zeitpunkt der letzten Statusänderung
          example: "2024-06-01T10:00:00Z"

    HealthResponse:
      type: object
      description: Systemgesundheitsstatus
      required:
        - status
        - timestamp
        - uptime
        - environment
        - version
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          description: Systemstatus
          example: "healthy"
        database:
          type: string
          enum: [connected, disconnected]
          description: >-
            Status der Datenbankverbindung. `connected` bei erfolgreicher
            Konnektivitätsprüfung (HTTP 200), `disconnected` bei Ausfall (HTTP 503).
          example: "connected"
        timestamp:
          type: string
          format: date-time
          description: Zeitpunkt des Health Checks
          example: "2024-01-01T14:30:00Z"
        uptime:
          type: number
          description: Betriebszeit in Sekunden
          example: 86400.5
        environment:
          type: string
          description: Laufzeitumgebung
          example: "production"
        version:
          type: string
          description: Anwendungsversion
          example: "2.2.3"
        gitSha:
          type: string
          description: >-
            Auf 7 Stellen gekürzter Git-Commit-Hash des laufenden Builds. Kommt aus
            dem Docker-Build-Arg VCS_REF; "unknown" bei Builds ohne dieses Build-Arg
            (z.B. lokales `npm run dev`).
          example: "a1b2c3d"
        buildDate:
          type: string
          description: >-
            Zeitpunkt, zu dem das laufende Image gebaut wurde (Docker-Build-Arg
            BUILD_DATE). "unknown" bei Builds ohne dieses Build-Arg.
          example: "2026-07-31T10:00:00Z"
        responseTime:
          type: string
          description: Antwortzeit des letzten Checks
          example: "12ms"

    ConfigEntry:
      type: object
      description: Konfigurationseintrag
      required:
        - key
        - value
        - category
      properties:
        key:
          type: string
          description: Konfigurationsschlüssel
          example: "display.maxSightings"
        value:
          description: Konfigurationswert (beliebiger JSON-Wert — JSONB in der DB)
          example: 100
        description:
          type: string
          nullable: true
          description: Beschreibung des Eintrags
          example: "Maximale Anzahl Sichtungen auf Startseite"
        category:
          type: string
          description: Kategorie des Eintrags (NOT NULL in DB)
          example: "display"

    PublicConfig:
      type: object
      description: Öffentlich verfügbare Konfigurationswerte (Werte können beliebige JSON-Typen sein)
      additionalProperties: {}
      example:
        "display.dateFormat": "DD.MM.YYYY"
        "display.maintenanceMode": false
        "display.maintenanceMessage": "Die Anwendung wird gewartet. Bitte versuchen Sie es später erneut."
        "mobile.minAppVersion": "1.0.0"
        "mobile.updateMessage": "Eine neue Version der App ist verfügbar."
        "data.exportFormats": ["csv", "json", "kml", "xml"]

    UploadConfig:
      type: object
      description: Konfiguration für Datei-Uploads
      required:
        - maxFileSize
        - maxFileSizeBytes
        - maxVideoFileSize
        - maxVideoFileSizeBytes
        - maxTotalUploadSize
        - maxTotalUploadSizeBytes
        - allowedTypes
        - accept
      properties:
        maxFileSize:
          type: integer
          description: Maximale Dateigröße in MB
          example: 10
        maxFileSizeBytes:
          type: integer
          description: Maximale Dateigröße in Bytes
          example: 10485760
        maxVideoFileSize:
          type: integer
          description: Maximale Videodateigröße in MB
          example: 100
        maxVideoFileSizeBytes:
          type: integer
          description: Maximale Videodateigröße in Bytes
          example: 104857600
        maxTotalUploadSize:
          type: integer
          description: |
            Gesamtlimit je Meldung in MB (`security.maxTotalUploadSize`), für
            beide Authentifizierungsstufen identisch. Client-seitig der einzig
            maßgebliche Wert — die Konstante `UPLOAD_LIMITS.MAX_TOTAL_SIZE` ist
            nur noch der Offline-Fallback, wenn dieser Endpunkt nicht erreichbar
            ist.
          example: 250
        maxTotalUploadSizeBytes:
          type: integer
          description: Gesamtlimit je Meldung in Bytes
          example: 262144000
        allowedTypes:
          type: array
          items:
            type: string
          description: Erlaubte MIME-Types
          example: ["image/jpeg", "image/png", "image/gif", "image/webp"]
        accept:
          type: string
          description: Accept-Attribut für HTML file input
          example: "image/*"

  responses:
    LoginRedirect:
      description: Nicht authentifiziert – Weiterleitung zum Login (SvelteKit session-cookie auth)
      headers:
        Location:
          description: Login-URL mit returnUrl-Parameter
          schema:
            type: string
            example: "/api/auth/login?returnUrl=/api/config"

    BadRequest:
      description: Ungültige Anfrage
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Nicht authentifiziert
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Authentifizierung erforderlich"

    Forbidden:
      description: Nicht autorisiert
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Keine Berechtigung für diese Operation"

    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Ressource nicht gefunden"

    ValidationError:
      description: Validierungsfehler
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    RateLimitExceeded:
      description: Rate Limit überschritten (20 Anfragen pro Stunde)
      headers:
        Retry-After:
          description: Sekunden bis das Rate Limit zurückgesetzt wird
          schema:
            type: integer
            example: 3600
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Too Many Requests"
            message: "Rate limit exceeded. Try again later."

    InternalServerError:
      description: Interner Serverfehler
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Interner Serverfehler"
