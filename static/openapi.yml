  /api/admin/cleanup-orphans:
    post:
      tags:
        - Admin
      summary: Verwaiste Uploads ermitteln und entfernen
      description: >
        Entfernt Dateizeilen ohne Sichtung, deren Upload älter als die
        Aufbewahrungsfrist ist, sowie Dateien ohne Zeile. Zugang über
        Admin-Session oder Bearer-Token (`CLEANUP_TOKEN`) für einen externen
        Web-Cron. Vorgabe ist die Vorschau — gelöscht wird nur mit
        `mode=execute`. Unlesbare Parameter fallen auf die sichere Vorgabe
        zurück, damit ein Cron nicht wegen eines Tippfehlers stillsteht.
      security:
        - adminAuth: []
        - cleanupToken: []
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [preview, execute]
            default: preview
        - name: hours
          in: query
          description: Aufbewahrungsfrist; kleinere Werte werden auf die Mindestfrist geklemmt.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Fundstücke pro Aufruf; eine Zeile samt Datei zählt als eins.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: Lauf durchgeführt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupReport'
        '401':
          description: Kein oder falsches Token
        '429':
          description: Rate Limit überschritten
        '500':
          description: Unerwarteter Fehler

  /api/admin/inbox-status:
    get:
      tags:
        - Admin
      summary: Höchste offene Sichtungs-ID
      description: >
        Liefert die höchste ID einer noch offenen Sichtung (weder freigegeben
        noch abgelehnt). Die Eingangsseite merkt sich den Wert beim Laden und
        fragt hier minütlich nach, ob es inzwischen eine höhere gibt — daraus
        entsteht der Hinweis auf neue offene Arbeit im Eingang.


        Bewusst **nicht** ausschließlich neu eingegangene Meldungen: Wird eine
        Entscheidung zurückgenommen (`PATCH /api/sightings/{id}/verify` mit
        `verdict: reset`), kehrt die Sichtung in die offene Menge zurück und
        zählt mit. Der Hinweis im Eingang ist deshalb mit „Neue Meldungen im
        Eingang" beschriftet und nicht mit „eingegangen".


        Antwortet bei fehlender Admin-Session mit 401 und ausdrücklich nicht mit
        einer Weiterleitung: Ein `fetch` folgte der Weiterleitung und wertete
        das Login-HTML als Erfolg.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Aktueller Stand des Eingangs
          content:
            application/json:
              schema:
                type: object
                required: [maxOpenId]
                properties:
                  maxOpenId:
                    type: integer
                    description: Höchste offene Sichtungs-ID; 0, wenn nichts offen ist.
                    example: 20431
        '401':
          description: Keine Admin-Session

  /api/admin/spam-rescore:
    post:
      tags:
        - Admin
      summary: Bestehende Sichtungen nachträglich auf Spam bewerten
      description: >
        Bewertet Sichtungen ohne gespeicherten Spam-Score (`spam_score IS NULL`)
        und schreibt `spam_score`/`spam_indicators`. Idempotent und
        wiederholbar: Ein abgebrochener Lauf macht beim nächsten Aufruf dort
        weiter. Arbeitet in Batches — bei `done: false` erneut aufrufen.


        Der Endpunkt existiert, weil die Datenbank auf den deployten Hosts von
        außen nicht erreichbar ist und die Bewertung MX-DNS-Lookups braucht,
        also nicht als SQL-Skript läuft.


        Nachträgliche Scores sind systematisch milder als die einer echten
        Einreichung: Formular-Token und Duplikat-Fenster existieren nur zum
        Meldezeitpunkt. Zugang über Admin-Session oder Bearer-Token
        (`CLEANUP_TOKEN`).
      security:
        - adminAuth: []
        - cleanupToken: []
      parameters:
        - name: limit
          in: query
          description: Zeilen pro Aufruf. Unlesbare Werte fallen auf die Vorgabe zurück.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Batch bewertet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpamRescoreReport'
        '401':
          description: >-
            Nicht autorisiert — erforderlich ist eine angemeldete Admin-Session
            oder ein gültiges `CLEANUP_TOKEN`. Eine Session ohne Admin-Rolle
            wird ebenso abgewiesen wie ein fehlendes oder falsches Token.
        '429':
          description: Rate Limit überschritten
        '500':
          description: Unerwarteter Fehler

  /api/admin/reporter-hash:
    post:
      tags:
        - Admin
      summary: Melder-Hash für bestehende Sichtungen nachholen
      description: >
        Berechnet den Melder-Hash (`melder_hash`, HMAC-SHA256 der normalisierten
        E-Mail-Adresse) für Sichtungen mit Adresse, die noch keinen haben und
        nicht anonymisiert sind, und setzt `melder_intern`. Der Hash verknüpft
        die Meldungen einer Person auch nach der Anonymisierung der
        Kontaktdaten. Er wird nie ausgegeben, auch nicht von diesem Endpunkt.


        Muss nach dem ersten Setzen von `REPORTER_HASH_KEY` über den ganzen
        Bestand laufen, solange die Adressen noch vorhanden sind. Idempotent und
        wiederholbar; arbeitet in Batches — bei `done: false` erneut aufrufen.
        Zugang über Admin-Session oder Bearer-Token (`CLEANUP_TOKEN`).
      security:
        - adminAuth: []
        - cleanupToken: []
      parameters:
        - name: limit
          in: query
          description: Zeilen pro Aufruf. Unlesbare Werte fallen auf die Vorgabe zurück.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
      responses:
        '200':
          description: Batch gehasht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporterHashReport'
        '401':
          description: >-
            Nicht autorisiert — erforderlich ist eine angemeldete Admin-Session
            oder ein gültiges `CLEANUP_TOKEN`.
        '429':
          description: Rate Limit überschritten
        '500':
          description: Unerwarteter Fehler
        '503':
          description: >-
            `REPORTER_HASH_KEY` fehlt oder ist kürzer als 32 Zeichen. Es wurde
            nichts geschrieben.

  /api/admin/anonymize:
    post:
      tags:
        - Admin
      summary: Kontaktdaten 3 Monate nach Eingang anonymisieren
      description: >
        Leert bei fälligen Sichtungen die Kontaktdaten der meldenden Person
        (E-Mail, Telefon, Fax, Anschrift immer; Vor- und Nachname ohne
        Namens-Einwilligung; Schiffsname und Heimathafen ohne
        Schiffsnamen-Einwilligung) und setzt `anonymisiert_am`. Fällig ist eine
        Sichtung, wenn `created + 3 Monate − 1 Tag` erreicht ist, unabhängig vom
        Prüfstatus. Freitexte und der Melder-Hash bleiben.


        Vorgabe ist die Vorschau; geleert wird nur mit `mode=execute`, und auch
        dann erst nach der einmaligen Freischaltung — vorher antwortet der
        Endpunkt mit `executed: false` und `skipped: "not_activated"`. Vor dem
        Leeren holt jeder Lauf fehlende Melder-Hashes nach; wird das nicht
        fertig, wird nichts geleert (`skipped: "hash_backfill_incomplete"`).
        Idempotent; bei `done: false` erneut aufrufen. Zugang über
        Admin-Session oder Bearer-Token (`CLEANUP_TOKEN`) für den täglichen Cron.
      security:
        - adminAuth: []
        - cleanupToken: []
      parameters:
        - name: mode
          in: query
          description: '`execute` leert. Jeder andere Wert oder kein Wert: Vorschau.'
          schema:
            type: string
            enum: [preview, execute]
            default: preview
        - name: limit
          in: query
          description: Höchstens so viele Sichtungen je Aufruf. Unlesbare Werte fallen auf die Vorgabe zurück.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
      responses:
        '200':
          description: Vorschau oder Lauf abgeschlossen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymizationReport'
        '401':
          description: >-
            Nicht autorisiert — erforderlich ist eine angemeldete Admin-Session
            oder ein gültiges `CLEANUP_TOKEN`.
        '429':
          description: Rate Limit überschritten
        '500':
          description: Unerwarteter Fehler
        '503':
          description: >-
            Nur bei `mode=execute`: `REPORTER_HASH_KEY` fehlt oder ist kürzer als
            32 Zeichen. Es wurde nichts geändert.

  /api/admin/reporter-erasure:
    post:
      tags:
        - Admin
      summary: Löschersuchen nach Art. 17 DSGVO bearbeiten
      description: >
        Findet alle Sichtungen einer Person über die genannte E-Mail-Adresse —
        über den Melder-Hash, also auch bereits anonymisierte — und
        anonymisiert sie sofort. Anders als der tägliche Lauf leert das
        Löschersuchen Name, Schiffsname und Heimathafen auch bei Einwilligung —
        wer die Löschung verlangt, zieht sie damit zurück. Zusätzlich wird der
        Melder-Hash geleert: Die Sichtungen bleiben,
        die Verknüpfung zur Person ist weg. Bereits anonymisierte Sichtungen
        behalten ihr ursprüngliches `anonymisiert_am`.


        **Erfordert die Rolle `superadmin`** und eine angemeldete Session; den
        Cron-Token akzeptiert der Endpunkt nicht, weil schon die Vorschau
        verrät, ob es zu einer Adresse Meldungen gibt. Die Adresse wird weder
        geloggt noch im Audit-Eintrag gespeichert.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  description: Adresse der Person; Groß-/Kleinschreibung und Leerraum am Rand zählen nicht.
                mode:
                  type: string
                  enum: [preview, execute]
                  default: preview
      responses:
        '200':
          description: Vorschau oder Bearbeitung abgeschlossen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureReport'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '400':
          description: Keine oder keine verwertbare Adresse angegeben.
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Unerwarteter Fehler
        '503':
          description: >-
            `REPORTER_HASH_KEY` fehlt oder ist kürzer als 32 Zeichen. Ohne ihn
            fände die Suche die anonymisierten Sichtungen der Person nicht; es
            wurde nichts geändert.

  /api/admin/test-email:
    post:
      tags:
        - admin
      summary: Admin Test-E-Mail senden
      description: |
        Sendet eine Test-E-Mail für eine Sichtung oder eine einfache Test-E-Mail.

        **Erfordert die Rolle `superadmin`** — anders als der übrige `/api/admin`-Bereich,
        der `admin` genügen lässt. Mit `testType: sighting` verschickt der Endpunkt
        dieselbe interne Benachrichtigung wie eine echte Neu-Meldung; im Team-Postfach
        ist sie von einer solchen nicht zu unterscheiden. Empfänger ist immer die
        konfigurierte Adresse aus `notification.email.recipient`, nie die meldende Person.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sightingId:
                  type: integer
                  description: ID der Sichtung für eine Sichtungs-E-Mail
                  example: 42
                recipient:
                  type: string
                  format: email
                  description: Optionale Empfänger-E-Mail-Adresse
                  example: "test@example.com"
                testType:
                  type: string
                  enum: [sighting, simple]
                  description: Art der Test-E-Mail
                  example: "simple"
      responses:
        '200':
          description: E-Mail erfolgreich gesendet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/weather/{id}/refresh:
    post:
      tags:
        - admin
      summary: Wetterdaten einer Sichtung aktualisieren
      description: Aktualisiert die Wetterdaten für eine bestimmte Sichtung (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            example: 42
      responses:
        '200':
          description: Wetterdaten aktualisiert
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      weatherData:
                        type: object
                        description: Aktualisierte Wetterdaten der Sichtung
                        additionalProperties: true
                    required:
                      - weatherData
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
