openapi: 3.0.3
info:
  title: Ostsee-Tiere API
  description: |
    API für die Meldung und Verwaltung von Meerestier-Sichtungen in der Ostsee.
    
    Diese API ermöglicht es Bürgern, Forschern und Naturbeobachtern, ihre Sichtungen von Walen, Robben und anderen Meerestieren zu melden und zu verwalten.
    
    ## Authentifizierung
    
    Für Admin-Funktionen ist eine Authentifizierung über Auth0 erforderlich. Die Authentifizierung erfolgt über Session-Cookies.
    
    ## Datenformate
    
    - Alle Datumsangaben sind im ISO 8601 Format (YYYY-MM-DD)
    - Koordinaten verwenden WGS84 (dezimale Grade)
    - Alle Antworten sind im JSON-Format
    
  version: 1.0.0
  contact:
    name: Ostsee-Tiere Team
    url: https://ostsee-tiere.de
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://localhost:4000
    description: Entwicklungsserver (HTTPS)
  - url: https://ostsee-tiere.de
    description: Produktionsserver

tags:
  - name: sightings
    description: Sichtungsmeldungen
  - name: legacy
    description: Legacy REST API für Mobile Apps
  - name: auth
    description: Authentifizierung
  - name: files
    description: Datei-Upload und -Verwaltung
  - name: geo
    description: Geografische Validierung
  - name: map
    description: Kartendaten
  - name: export
    description: Datenexport
  - name: media
    description: Sichere Medien-Bereitstellung
  - name: security
    description: Sicherheit und CSP Reports
  - name: config
    description: Konfigurationsverwaltung (Admin)
  - name: admin
    description: Admin-spezifische Operationen
  - name: health
    description: Systemgesundheit und Monitoring
  - name: statistics
    description: Statistiken und Metriken

paths:
  /api/sightings:
    get:
      tags:
        - sightings
      summary: Sichtungen abrufen
      description: |
        Ruft öffentlich verfügbare Sichtungen für ein bestimmtes Jahr ab.
        Es werden ausschließlich freigegebene Sichtungen zurückgegeben
        (`freigegeben_am IS NOT NULL`) — dieselbe öffentliche Grundmenge wie
        die Karte. Es gibt keinen Parameter, der ungeprüfte Meldungen einschließt.
      parameters:
        - name: year
          in: query
          description: >-
            Jahr der Sichtungen. Ohne Angabe wird das laufende Kalenderjahr
            verwendet (kein fester Default-Wert).
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2030
            example: 2024
      responses:
        '200':
          description: Liste der Sichtungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicSighting'
              example:
                - id: 1840
                  ts: 1672531200
                  dt: "01.01.2024"
                  ti: "14:30"
                  lat: 54.3233
                  lon: 13.0814
                  ct: 3
                  yo: 1
                  ta: 1
                  tf: 0
                  na: "Max Mustermann"
                  ar: "Greifswalder Bodden"
                  sh: "MS Baltic"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags:
        - sightings
      summary: Neue Sichtung melden
      description: Erstellt eine neue Sichtungsmeldung
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SightingFormData'
      responses:
        '201':
          description: Sichtung erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SightingResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          description: Datenbank-Integritätsfehler (z.B. doppelter Eintrag)
          content:
            application/json:
              schema:
                type: object
                required: [success, code, message]
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    enum: [DATABASE_ERROR]
                  message:
                    type: string
                  detail:
                    type: string
                    description: Nur in Development-Umgebung
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sightings/{id}:
    get:
      tags:
        - sightings
      summary: Einzelne Sichtung abrufen
      description: Ruft Details einer bestimmten Sichtung ab (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            minimum: 1
            example: 1840
      responses:
        '200':
          description: Sichtungsdetails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedSighting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      tags:
        - sightings
      summary: Sichtung aktualisieren
      description: >
        Aktualisiert eine bestehende Sichtung (Admin-Berechtigung erforderlich).


        Ist die Sichtung anonymisiert, sind Vor-, Nachname und E-Mail keine
        Pflicht mehr. Felder, die die Anonymisierung geleert hat (Kontaktdaten;
        Name ohne Namens-, Schiffsname und Heimathafen ohne
        Schiffsnamen-Einwilligung), lassen sich nicht wieder füllen — die
        Anfrage wird dann mit 422 abgewiesen.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            minimum: 1
            example: 1840
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SightingFormData'
      responses:
        '200':
          description: Sichtung erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedSighting'
        '400':
          $ref: '#/components/responses/ValidationError'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            Die Sichtung ist anonymisiert, und die Anfrage würde ein geleertes
            Feld wieder füllen. `code` ist `ANONYMIZED_FIELDS`, `errors` nennt
            die Felder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - sightings
      summary: Sichtung löschen
      description: Löscht eine Sichtung (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            minimum: 1
            example: 1840
      responses:
        '200':
          description: Sichtung erfolgreich gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sightings/{id}/verify:
    patch:
      tags:
        - sightings
      summary: Sichtung prüfen, ablehnen oder zurücksetzen
      description: |
        Setzt den Prüfstatus einer Sichtung (Admin-Berechtigung erforderlich).

        Eine Sichtung kennt genau zwei Veröffentlichungszustände: ungeprüft und
        geprüft. Geprüft bedeutet zugleich veröffentlicht — einen dritten Zustand
        "geprüft, aber nicht freigegeben" gibt es nicht. Die Ablehnung ist keine
        dritte Veröffentlichungsstufe, sondern eine Triage-Markierung: abgelehnt
        heißt ungeprüft und nicht veröffentlicht, nur mit festgehaltener
        Entscheidung.

        Der Endpunkt schreibt deshalb alle Statusspalten immer gemeinsam in einem
        Update: `verified`, `approvedAt`, `rejectedAt` und `rejectedBy`.
        `approvedAt` und `rejectedAt` sind nie gleichzeitig gesetzt.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            minimum: 1
            example: 1840
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  required: [verdict]
                  properties:
                    verdict:
                      type: string
                      enum: [approve, reject, reset]
                      description: >
                        approve = prüfen und veröffentlichen, reject = Triage
                        „abgelehnt" (nicht veröffentlicht), reset = auf
                        ungeprüft zurückziehen.
                      example: approve
                - type: object
                  required: [verified]
                  properties:
                    verified:
                      type: integer
                      enum: [0, 1]
                      description: 'Alias: 1 = approve, 0 = reset.'
                      example: 1
      responses:
        '200':
          description: Prüfstatus erfolgreich aktualisiert
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - id
                  - verdict
                  - verified
                  - approvedAt
                  - rejectedAt
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: integer
                    example: 1840
                  verdict:
                    type: string
                    enum: [approve, reject, reset]
                    description: Angewendete Entscheidung (bei Alias-Body abgeleitet)
                    example: approve
                  verified:
                    type: integer
                    enum: [0, 1]
                    example: 1
                  approvedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Zeitpunkt der Freigabe; null wenn ungeprüft
                    example: "2026-07-28T09:12:44.000Z"
                  rejectedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Zeitpunkt der Ablehnung; null wenn nicht abgelehnt
                    example: null
                  message:
                    type: string
                    example: "Sichtung wurde geprüft und freigegeben"
        '400':
          $ref: '#/components/responses/BadRequest'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - sightings
      summary: Prüfstatus und Status-Historie abrufen
      description: |
        Gibt den aktuellen Prüf- und Freigabestatus einer Sichtung zurück sowie
        die Historie aller über diesen Endpunkt getroffenen Entscheidungen
        (Admin-Berechtigung erforderlich).

        Die Historie beginnt mit ihrer Einführung: Sichtungen, deren Status aus
        dem Altsystem stammt, liefern eine leere Liste. Das ist kein Fehler und
        bedeutet nicht, dass nie entschieden wurde — der aktuelle Zustand steht
        in `approvedAt`/`rejectedAt`.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            minimum: 1
            example: 1840
      responses:
        '200':
          description: Aktueller Prüf- und Freigabestatus
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - verified
                  - approvedAt
                  - rejectedAt
                  - history
                properties:
                  id:
                    type: integer
                    example: 1840
                  verified:
                    type: integer
                    enum: [0, 1]
                    example: 1
                  approvedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Zeitpunkt der Freigabe; null wenn ungeprüft
                    example: "2026-07-28T09:12:44.000Z"
                  rejectedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Zeitpunkt der Ablehnung; null wenn nicht abgelehnt
                    example: null
                  history:
                    type: array
                    description: >
                      Alle Statusentscheidungen, älteste zuerst. Leer für
                      Sichtungen aus dem Altsystem.
                    items:
                      $ref: '#/components/schemas/SightingStatusLogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sightings/{id}/spam-check:
    get:
      tags:
        - sightings
      summary: Spam-Befund einer Sichtung — gespeichert und neu berechnet
      description: |
        Liefert **zwei** Befunde nebeneinander (Admin-Berechtigung erforderlich):
        `stored` ist der zum Meldezeitpunkt persistierte Score aus
        `spam_score`/`spam_indicators` — dieselbe Zahl, die Tabelle und Eingang
        anzeigen. `recomputed` ist ein frischer Lauf der Heuristik über den
        aktuellen Datensatz.

        Die beiden weichen systematisch voneinander ab, und das ist kein Fehler:
        Vier Indikatoren wiegen je 2 Punkte und existieren nur im Moment des
        Absendens — Formular-Token fehlt/ungültig, verdächtig schnell
        abgeschickt sowie die beiden Duplikat-Signale. Ihre Eingangsdaten
        (Token, Absendedauer, 24-Stunden- bzw. 7-Tage-Fenster) stehen nirgends
        in der Zeile, `recomputed` kann sie also nicht rekonstruieren und liegt
        entsprechend tiefer. Umgekehrt kann er höher liegen, wenn der Datensatz
        seit der Meldung bearbeitet wurde oder die E-Mail-Domain inzwischen
        keinen MX-Record mehr hat.

        Maßgeblich für die Triage ist `stored`. `stored: null` heißt „nie
        bewertet" (Altbestand, Legacy-Eingang) und ist nicht dasselbe wie
        Score 0 (`docs/SPAM_DETECTION.md`).
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Befund ermittelt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpamCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sightings/{id}/reporter-history:
    get:
      tags:
        - sightings
      summary: Was über den Melder dieser Sichtung bekannt ist
      description: |
        Zählt die **anderen** Meldungen derselben E-Mail-Adresse nach
        Bearbeitungsstand (Admin-Berechtigung erforderlich). Reine
        Triage-Hilfe: Nichts davon wird gespeichert, nichts fließt in den
        Spam-Score ein, und es wird nichts entschieden.

        `history: null` heißt „nicht ermittelbar" (keine Adresse hinterlegt
        oder Abfrage fehlgeschlagen) und ist nicht dasselbe wie ein Aggregat
        aus lauter Nullen — die Oberfläche zeigt dafür kein Badge.

        Die Adresse ist nicht verifiziert; die Zahlen sind eine Beobachtung
        über eine Adresse, kein Urteil über eine Person
        (`docs/SPAM_DETECTION.md`).
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Historie ermittelt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporterHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sightings/{id}/queue:
    get:
      tags:
        - sightings
      summary: Nachbarn im Stapel der offenen Sichtungen
      description: |
        Beantwortet „wer liegt vor und hinter dieser Sichtung" im Stapel der
        offenen (weder freigegebenen noch abgelehnten) Meldungen
        (Admin-Berechtigung erforderlich). Trägt den Auto-Advance der
        Detailansicht: Nach einer Entscheidung springt sie direkt zu `next`,
        ohne Umweg über die Liste.

        Die Nachbarn werden per Keyset-Vergleich gegen `(created, id)` der
        aktuellen Sichtung gesucht, nicht per Offset — ein Offset wäre nach
        jeder Entscheidung um eins falsch, weil die entschiedene Sichtung den
        Stapel verlässt. Deshalb bleibt `next`/`prev` auch für eine bereits
        entschiedene Sichtung beantwortbar; nur `position` wird dann `null`,
        weil sie keinen Rang im offenen Stapel mehr hat.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            minimum: 1
            example: 1840
        - name: order
          in: query
          description: >
            Sortierrichtung des Stapels nach Meldedatum. Alles außer `asc`
            fällt auf `desc` zurück.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
            example: desc
      responses:
        '200':
          description: Nachbarn, Position und Gesamtzahl im offenen Stapel
          content:
            application/json:
              schema:
                type: object
                required:
                  - next
                  - prev
                  - position
                  - total
                properties:
                  next:
                    $ref: '#/components/schemas/QueueNeighbor'
                  prev:
                    $ref: '#/components/schemas/QueueNeighbor'
                  position:
                    type: integer
                    nullable: true
                    description: >
                      1-basierter Rang im offenen Stapel; null, wenn die
                      Sichtung nicht mehr offen ist.
                    example: 17
                  total:
                    type: integer
                    description: Gesamtzahl offener Sichtungen
                    example: 653
        '400':
          $ref: '#/components/responses/BadRequest'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sightings/export:
    get:
      tags:
        - export
      summary: Sichtungen exportieren
      description: Exportiert Sichtungen in verschiedenen Formaten (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: format
          in: query
          description: Exportformat
          required: true
          schema:
            type: string
            enum: [json, csv, xml, kml]
            example: json
        - name: fromDate
          in: query
          description: Startdatum (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: toDate
          in: query
          description: Enddatum (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2024-12-31"
        - name: verified
          in: query
          description: Nur verifizierte Sichtungen
          schema:
            type: boolean
            example: true
        - $ref: '#/components/parameters/ExportEntryChannel'
        - $ref: '#/components/parameters/ExportMediaUpload'
        - $ref: '#/components/parameters/ExportBalticSea'
        - $ref: '#/components/parameters/ExportDeadFinding'
        - $ref: '#/components/parameters/ExportSearch'
      responses:
        '200':
          description: Exportdatei
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            application/vnd.google-earth.kml+xml:
              schema:
                type: string
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sightings/export/json:
    get:
      tags:
        - export
      summary: JSON-Export
      description: Exportiert Sichtungen im JSON-Format (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/ExportDateFrom'
        - $ref: '#/components/parameters/ExportDateTo'
        - $ref: '#/components/parameters/ExportVerified'
        - $ref: '#/components/parameters/ExportEntryChannel'
        - $ref: '#/components/parameters/ExportMediaUpload'
        - $ref: '#/components/parameters/ExportBalticSea'
        - $ref: '#/components/parameters/ExportDeadFinding'
        - $ref: '#/components/parameters/ExportSearch'
      responses:
        '200':
          description: JSON-Datei mit Sichtungen
          content:
            application/json:
              schema:
                type: object
                required: [metadata, sichtungen]
                properties:
                  metadata:
                    type: object
                    required: [exportDate, recordCount, filters]
                    properties:
                      exportDate:
                        type: string
                        format: date-time
                      recordCount:
                        type: integer
                      filters:
                        type: object
                        properties:
                          dateFrom:
                            type: string
                            nullable: true
                          dateTo:
                            type: string
                            nullable: true
                          verified:
                            type: string
                            nullable: true
                          entryChannel:
                            type: string
                            nullable: true
                          mediaUpload:
                            type: string
                            nullable: true
                  sichtungen:
                    type: array
                    items:
                      $ref: '#/components/schemas/DetailedSighting'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Interner Serverfehler beim JSON-Export
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /api/sightings/export/csv:
    get:
      tags:
        - export
      summary: CSV-Export
      description: Exportiert Sichtungen im CSV-Format (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/ExportDateFrom'
        - $ref: '#/components/parameters/ExportDateTo'
        - $ref: '#/components/parameters/ExportVerified'
        - $ref: '#/components/parameters/ExportEntryChannel'
        - $ref: '#/components/parameters/ExportMediaUpload'
        - $ref: '#/components/parameters/ExportBalticSea'
        - $ref: '#/components/parameters/ExportDeadFinding'
        - $ref: '#/components/parameters/ExportSearch'
      responses:
        '200':
          description: CSV-Datei mit Sichtungen
          content:
            text/csv:
              schema:
                type: string
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Interner Serverfehler beim CSV-Export
          content:
            text/plain:
              schema:
                type: string

  /api/sightings/export/xml:
    get:
      tags:
        - export
      summary: XML-Export
      description: Exportiert Sichtungen im XML-Format (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/ExportDateFrom'
        - $ref: '#/components/parameters/ExportDateTo'
        - $ref: '#/components/parameters/ExportVerified'
        - $ref: '#/components/parameters/ExportEntryChannel'
        - $ref: '#/components/parameters/ExportMediaUpload'
        - $ref: '#/components/parameters/ExportBalticSea'
