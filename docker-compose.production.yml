# ============================================
# Docker Compose Production Configuration
# ============================================
# Production-ready setup for Ostsee-Tiere platform
#
# Services: Application + PostgreSQL with PostGIS
#
# Application logs go to stdout and are captured by the json-file driver
# (rotation configured per service below); read them with `docker compose logs`.
# See docs/DOCKER_DEPLOYMENT.md -> Logging
#
# Quick Start:
#   1. Copy .env.docker to .env and configure
#   2. docker compose -f docker-compose.production.yml up -d
#      (database schema is migrated automatically on startup)
#   3. Access app at http://localhost:3000

services:
  # ============================================
  # Application Service
  # ============================================
  app:
    # IMAGE_TAG steuert, welchem Zeiger dieser Stack folgt:
    #   production  - freigegebener Stand (Default; wird nur von
    #                 promote-production.yml bewegt)
    #   staging     - jedes neue Release, ungeprüft (Staging-Host)
    #   vX.Y.Z      - feste Version, empfohlen für Prod-Stacks
    #
    # APP_IMAGE überschreibt die komplette Referenz und ist der einzige Weg,
    # auf einen Digest zu pinnen — ein Digest hängt mit `@` statt `:` an und
    # passt deshalb nicht in IMAGE_TAG:
    #   APP_IMAGE=ghcr.io/jansinger/ostsee-tiere@sha256:...
    # Siehe docs/RELEASE_PIPELINE.md
    image: ${APP_IMAGE:-ghcr.io/jansinger/ostsee-tiere:${IMAGE_TAG:-production}}
    container_name: ostsee-tiere-app
    restart: unless-stopped
    # SECURITY: Bind to localhost only if using reverse proxy
    ports:
      - '${APP_HOST:-0.0.0.0}:${APP_PORT:-3000}:3000'
    environment:
      # Node.js Configuration
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Zeitzone bewusst fixiert — siehe docs/ENVIRONMENT.md → TZ.
      # Deutsche Ortszeit steht überall explizit im Code; nicht auf UTC
      # abweichen, ohne die dortigen Hinweise gelesen zu haben.
      TZ: ${TZ:-UTC}

      # Database Connection (only DATABASE_POSTGRES_URL is used by the application)
      DATABASE_POSTGRES_URL: ${DATABASE_POSTGRES_URL}

      # Startup migrations (see docs/ENVIRONMENT.md)
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      ALLOW_DESTRUCTIVE_MIGRATIONS: ${ALLOW_DESTRUCTIVE_MIGRATIONS:-false}

      # Storage Configuration
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_PATH: /app/uploads

      # Vercel Blob Storage (if used)
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}

      # AWS S3 Storage (if used)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}

      # Google Cloud Storage (if used)
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${GOOGLE_CLOUD_STORAGE_BUCKET:-}

      # Application Settings
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-125829120}

      # Reverse-Proxy / Client-IP-Auflösung (adapter-node)
      # WICHTIG: Die App läuft hinter einem Reverse Proxy (Nginx/Caddy). Damit
      # getClientAddress() die echte Client-IP liefert (statt der Proxy-IP) und
      # das IP-basierte Rate-Limiting pro Client greift, MUSS der adapter-node
      # die Forwarded-Header auswerten. XFF_DEPTH = Anzahl vertrauenswürdiger
      # Proxies vor der App (bei genau einem Reverse Proxy: 1).
      ADDRESS_HEADER: ${ADDRESS_HEADER:-x-forwarded-for}
      XFF_DEPTH: ${XFF_DEPTH:-1}
      PROTOCOL_HEADER: ${PROTOCOL_HEADER:-x-forwarded-proto}
      HOST_HEADER: ${HOST_HEADER:-x-forwarded-host}

      # Security Settings
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      COOKIE_NAME: ${COOKIE_NAME:-auth-cookie}
      # Bearer-Token für POST /api/admin/cleanup-orphans (externer Web-Cron).
      # Ohne Wert bleibt der Endpunkt nur über eine Admin-Session erreichbar.
      CLEANUP_TOKEN: ${CLEANUP_TOKEN:-}
      # Schlüssel für den Melder-Hash (docs/ENVIRONMENT.md). Nie rotieren.
      # Ohne Wert: Meldungen ohne Hash, Backfill und Anonymisierung verweigern.
      REPORTER_HASH_KEY: ${REPORTER_HASH_KEY:-}

      # Auth0 Configuration
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      JWKS_URL: ${JWKS_URL}
      API_AUDIENCE: ${API_AUDIENCE}

      # Email Configuration (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_DEBUG_LOGGING: ${ENABLE_DEBUG_LOGGING:-false}

      # Feature Flags
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-false}

    volumes:
      # Persistent storage for uploaded files
      - uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

    networks:
      - ostsee-network

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    labels:
      - 'com.ostsee-tiere.service=app'
      - 'com.ostsee-tiere.version=${VERSION:-latest}'

    # Security hardening
    security_opt:
      - no-new-privileges:true
    # Note: read_only:true would require tmpfs for /tmp - enable if needed
    # read_only: true
    # tmpfs:
    #   - /tmp

    # Logging configuration (prevent disk space issues)
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

    # Resource limits (adjust based on server capacity)
    # Note: Requires Docker Compose with --compatibility flag or Docker Swarm mode
    # For standard docker compose, these limits are advisory only
    deploy:
      resources:
        limits:
          cpus: '${APP_CPU_LIMIT:-2}'
          memory: '${APP_MEMORY_LIMIT:-2G}'
        reservations:
          cpus: '0.5'
          memory: '512M'

  # ============================================
  # PostgreSQL with PostGIS
  # ============================================
  db:
    # PostgreSQL with PostGIS - override via POSTGRES_IMAGE_TAG if needed
    image: postgis/postgis:${POSTGRES_IMAGE_TAG:-18-3.6}
    container_name: ostsee-tiere-db
    restart: unless-stopped
    # SECURITY: Only expose to localhost, not publicly!
    # For external access, use SSH tunnel or reverse proxy
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    environment:
      # Database initialization (must match DATABASE_POSTGRES_URL in app)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ostsee
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=en_US.UTF-8'
      # Performance tuning (optional overrides)
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-256MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-16MB}

    volumes:
      # Persistent database storage (aligned with development compose configuration)
      - pgdata:/var/lib/postgresql
      # Backup directory
      - db-backups:/backups

    networks:
      - ostsee-network

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ostsee']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    labels:
      - 'com.ostsee-tiere.service=database'

    # Security hardening
    security_opt:
      - no-new-privileges:true

    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

# ============================================
# Named Volumes
# ============================================
volumes:
  # Application uploads (images, files)
  uploads:
    driver: local
    labels:
      - 'com.ostsee-tiere.volume=uploads'

  # PostgreSQL data
  pgdata:
    driver: local
    labels:
      - 'com.ostsee-tiere.volume=database'

  # Database backups
  db-backups:
    driver: local
    labels:
      - 'com.ostsee-tiere.volume=backups'

# ============================================
# Networks
# ============================================
networks:
  ostsee-network:
    driver: bridge
    labels:
      - 'com.ostsee-tiere.network=main'
